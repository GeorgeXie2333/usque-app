name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CMAKE_GENERATOR: Ninja
  FLUTTER_COMMIT: 84fc5cbb223bc12f83d65b647ff8a56caf779ffd

jobs:
  workflow-lint:
    name: GitHub Actions syntax and security lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: 1.26.4
          check-latest: false

      - name: Install pinned actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

      - name: Lint workflows
        run: actionlint -no-color

  rust:
    name: Rust format, lint, and tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          rustup default 1.97.1

      - name: Verify formatting
        run: |
          cargo fmt --all --check
          rustfmt \
            --edition 2021 \
            --check third_party/boring-sys-4.22.0/build/main.rs

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets --locked

  tooling-quality:
    name: Multi-language tooling quality
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install and verify Ruff 0.16.0
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ruff==0.16.0"
          test "$(ruff --version)" = "ruff 0.16.0"

      - name: Ruff lint and format check
        run: |
          ruff check tool
          ruff format --check tool

      - name: Install PowerShell
        shell: bash
        run: |
          set -euo pipefail
          # Microsoft package repository for PowerShell on Ubuntu 24.04
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc |
            sudo gpg --dearmor -o /usr/share/keyrings/microsoft.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft.gpg] https://packages.microsoft.com/ubuntu/24.04/prod noble main" |
            sudo tee /etc/apt/sources.list.d/microsoft-prod.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y powershell

      - name: Install and verify PSScriptAnalyzer 1.25.0
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser -AllowClobber
          $mod = Get-Module -ListAvailable PSScriptAnalyzer |
            Where-Object { $_.Version.ToString() -eq "1.25.0" } |
            Select-Object -First 1
          if (-not $mod) {
            throw "PSScriptAnalyzer 1.25.0 was not installed."
          }
          Write-Output "PSScriptAnalyzer $($mod.Version)"

      - name: PSScriptAnalyzer (warnings, errors, and casing block)
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          Import-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force
          $settings = "tool/PSScriptAnalyzerSettings.psd1"
          $findings = @(Get-ChildItem tool -Filter *.ps1 | ForEach-Object {
            Invoke-ScriptAnalyzer -Path $_.FullName -Settings $settings
            # PSUseCorrectCasing is Information, so run it outside the settings severity filter.
            Invoke-ScriptAnalyzer -Path $_.FullName -IncludeRule PSUseCorrectCasing
          })
          if ($findings.Count -gt 0) {
            $findings | Format-Table -AutoSize Severity, RuleName, ScriptName, Line, Message
            throw "PSScriptAnalyzer reported $($findings.Count) blocking finding(s)."
          }
          Write-Output "PSScriptAnalyzer: clean"

      - name: Install and verify Buf 1.72.0
        run: |
          set -euo pipefail
          BUF_VERSION=1.72.0
          # sha256 from https://github.com/bufbuild/buf/releases/download/v1.72.0/sha256.txt
          BUF_SHA256=8720830e26a733da55bb89bcd3cb44849c0965fc0c44fb5d691cccdc64dca5af
          curl -fsSL \
            "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64" \
            -o /tmp/buf
          echo "${BUF_SHA256}  /tmp/buf" | sha256sum -c -
          sudo install -m 0755 /tmp/buf /usr/local/bin/buf
          test "$(buf --version)" = "${BUF_VERSION}"

      - name: Buf lint and format check
        run: |
          set -euo pipefail
          buf lint
          buf format --exit-code --diff

      - name: Proto breaking check against PR target
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          # --against-config applies the current module path policy (proto/) even when
          # the PR base lacks buf.yaml, avoiding false FILE-path breaking failures.
          buf breaking \
            --against ".git#ref=refs/remotes/origin/${{ github.base_ref }}" \
            --against-config buf.yaml

  android-host:
    name: Android host unit tests and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter from pinned commit
        run: |
          mkdir -p "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" init
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin "$FLUTTER_COMMIT"
          git -C "$RUNNER_TEMP/flutter" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_COMMIT"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Install pinned Rust and Android toolchains
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy
          rustup default 1.97.1
          rustup target add \
            aarch64-linux-android \
            armv7-linux-androideabi \
            x86_64-linux-android
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1"

      - name: Clippy Android Rust (arm64-v8a lib)
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          & ./tool/build_android_rust.ps1 -CargoAction clippy

      - name: Resolve locked Flutter packages
        working-directory: apps/usque_gui
        run: flutter --suppress-analytics pub get --enforce-lockfile

      - name: Generate Android local build configuration
        working-directory: apps/usque_gui
        run: flutter --suppress-analytics build apk --debug --config-only --no-pub

      - name: Run Android application unit tests, ktlint, and lint
        working-directory: apps/usque_gui/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:ktlintCheck :app:testDebugUnitTest :app:lintDebug

  flutter:
    name: Flutter analysis and widget tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Flutter from pinned commit
        run: |
          mkdir -p "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" init
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin "$FLUTTER_COMMIT"
          git -C "$RUNNER_TEMP/flutter" checkout --detach FETCH_HEAD
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Verify Flutter revision
        run: |
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_COMMIT"
          flutter --suppress-analytics --version

      - name: Resolve locked packages
        working-directory: apps/usque_gui
        run: flutter --suppress-analytics pub get --enforce-lockfile

      - name: Format
        working-directory: apps/usque_gui
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        working-directory: apps/usque_gui
        run: flutter --suppress-analytics analyze --no-pub

      - name: Test
        working-directory: apps/usque_gui
        run: flutter --suppress-analytics test --no-pub

  go-oracle:
    name: Archived Go oracle
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: oracle/go/go.mod
          cache-dependency-path: oracle/go/go.sum
          check-latest: false

      - name: Verify modules
        working-directory: oracle/go
        run: go mod verify

      - name: Verify archived source against fork point
        run: python tool/verify_oracle_archive.py

      - name: Test oracle
        working-directory: oracle/go
        run: go test ./...

  release-contract:
    name: Release manifest and evidence contract
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Test fail-closed release contract
        run: python -m unittest discover -s tool -p "test_*.py" -v

  windows-installer-authoring:
    name: MSI authoring (${{ matrix.arch }})
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            variant: x64-v1
            wintun_arch: amd64
          - arch: x64
            variant: x64-v2
            wintun_arch: amd64
          - arch: arm64
            variant: arm64
            wintun_arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: 8.0.412

      - name: Restore pinned WiX tool
        run: dotnet tool restore

      - name: Create inert authoring fixture
        shell: pwsh
        run: |
          $payload = Join-Path $env:RUNNER_TEMP "msi-payload"
          New-Item -ItemType Directory -Path (Join-Path $payload "data") -Force | Out-Null
          $fixture = "third_party/wintun-0.14.1/wintun/bin/${{ matrix.wintun_arch }}/wintun.dll"
          Copy-Item $fixture (Join-Path $payload "usque.exe")
          Copy-Item $fixture (Join-Path $payload "usque-engine.exe")
          Copy-Item $fixture (Join-Path $payload "usque-agent.exe")
          Copy-Item $fixture (Join-Path $payload "wintun.dll")
          Copy-Item LICENSE.md (Join-Path $payload "data/LICENSE.md")

      - name: Compile MSI authoring
        shell: pwsh
        run: |
          $payload = Join-Path $env:RUNNER_TEMP "msi-payload"
          $output = Join-Path $env:RUNNER_TEMP "usque-authoring-${{ matrix.arch }}.msi"
          dotnet tool run wix -- build `
            -arch "${{ matrix.arch }}" `
            -bindpath "app=$payload" `
            -define "DisplayVersion=0.1.0-beta.1" `
            -define "MsiVersion=0.1.1" `
            -define "Variant=${{ matrix.variant }}" `
            -define "SignerSha256=$("0" * 64)" `
            -define "IconPath=$((Resolve-Path "assets/branding/usque-app-icon.ico").Path)" `
            -defaultcompressionlevel high `
            -intermediateFolder (Join-Path $env:RUNNER_TEMP "wix-${{ matrix.arch }}") `
            -pdbtype none `
            -out $output `
            packaging/windows/Usque.wxs
          if ($LASTEXITCODE -ne 0) { throw "WiX build failed." }

          & ./tool/verify_windows_msi.ps1 `
            -MsiPath $output `
            -Variant "${{ matrix.variant }}" `
            -ExpectedMsiVersion "0.1.1" `
            -ExpectedDisplayVersion "0.1.0-beta.1" `
            -SignerSha256 ("0" * 64)

          # Equal-version upgrades replace x64-v1/x64-v2 variants; only the
          # corresponding ICE61 warning is intentionally suppressed.
          dotnet tool run wix -- msi validate -sice ICE61 $output
          if ($LASTEXITCODE -ne 0) { throw "MSI ICE validation failed." }
