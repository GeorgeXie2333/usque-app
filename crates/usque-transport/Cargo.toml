[package]
name = "usque-transport"
description = "MASQUE transports and user-space proxy data plane for Usque"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
fault-injection = []
wireguard = ["dep:boringtun", "dep:reqwest"]

[dependencies]
boring-sys = "=4.22.0"
brotli-decompressor = "=6.1.0"
foreign-types = "=0.5.0"
async-trait.workspace = true
base64.workspace = true
bcrypt.workspace = true
crypto-bigint.workspace = true
curve25519-dalek.workspace = true
sha2.workspace = true
subtle.workspace = true
boring = { workspace = true, features = ["pq-experimental"] }
boringtun = { workspace = true, optional = true }
bytes.workspace = true
h2.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
libc.workspace = true
p256.workspace = true
quiche.workspace = true
reqwest = { workspace = true, optional = true }
rustls.workspace = true
serde_json.workspace = true
serde.workspace = true
socket2.workspace = true
smoltcp.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-boring = { workspace = true, features = ["pq-experimental"] }
tokio-rustls.workspace = true
tokio-util.workspace = true
tracing.workspace = true
ts_netstack_smoltcp.workspace = true
usque-core = { path = "../usque-core" }
usque-openvpn = { path = "../usque-openvpn" }
usque-geo = { path = "../usque-geo" }
usque-protocol = { path = "../usque-protocol" }
uuid.workspace = true
webpki-roots.workspace = true
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
usque-platform = { path = "../usque-platform" }
tempfile.workspace = true
proptest.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
