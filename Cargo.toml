[workspace]
resolver = "2"
members = [
    "crates/usque-agent",
    "crates/usque-android",
    "crates/usque-core",
    "crates/usque-engine",
    "crates/usque-ipc",
    "crates/usque-platform",
    "crates/usque-protocol",
    "crates/usque-transport",
    "crates/usque-uninstall",
]
default-members = [
    "crates/usque-agent",
    "crates/usque-android",
    "crates/usque-core",
    "crates/usque-engine",
    "crates/usque-ipc",
    "crates/usque-platform",
    "crates/usque-protocol",
    "crates/usque-transport",
    "crates/usque-uninstall",
]

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/GeorgeXie2333/usque-app"
authors = ["Usque contributors"]

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.dependencies]
async-trait = "0.1.89"
base64 = "0.23.1"
boring = "=4.22.0"
bytes = "1.10.1"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.48", features = ["derive"] }
futures = "0.3.31"
h2 = "0.4.16"
http = "1.3.1"
http-body-util = "0.1.4"
hyper = { version = "1.11.0", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
ipnet = { version = "2.11.0", features = ["serde"] }
jni = "0.22.4"
libc = "0.2.189"
p256 = { version = "0.14.0", features = ["pem", "pkcs8"] }
prost = "0.14.1"
prost-build = "0.14.1"
proptest = "1.8.0"
protoc-bin-vendored = "3.2.0"
reqwest = { version = "0.12.23", default-features = false, features = ["charset", "http2", "json", "rustls-tls", "socks", "stream"] }
rustls = "0.23.43"
quiche = { version = "=0.29.3", default-features = true }
security-framework = { version = "3.7.0", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11.0"
subtle = "2.6.1"
tempfile = "3.23.0"
thiserror = "2.0.17"
tokio = { version = "1.47.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-boring = "=4.22.0"
tokio-rustls = "0.26.4"
tokio-util = { version = "0.7.16", features = ["rt"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json"] }
ts_netstack_smoltcp = { version = "0.4.0", features = ["std", "tokio"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Credentials",
    "Win32_Security_Cryptography",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Networking_WinInet",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Rpc",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_System_DataExchange",
    "Win32_Graphics_Gdi",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
webpki-roots = "1.0.9"
zeroize = { version = "1.8.2", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

# BoringSSL's Windows C++ debug runtime is incompatible with Rust's MSVC
# development runtime. Keep Rust crates debuggable while compiling the native
# BoringSSL package with the release CRT in dev/test builds.
[profile.dev.package.boring-sys]
opt-level = 1
debug = false

[patch.crates-io]
# boring-sys 4.22.0 injects Cargo's API-unqualified Android target after the
# NDK toolchain has selected an API-qualified target. Keep the exact upstream
# release in-tree with only that Android build-script correction.
boring-sys = { path = "third_party/boring-sys-4.22.0" }

# 0.4.0 replays cancelled WouldBlock socket commands after their response
# channel is gone. If the socket's queued Close ran first, smoltcp panics on
# the stale handle. Keep the small audited patch in-tree until upstream ships
# an equivalent release.
ts_netstack_smoltcp_core = { path = "third_party/ts_netstack_smoltcp_core" }
