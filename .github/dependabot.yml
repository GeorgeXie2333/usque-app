version: 2

# oracle/go is intentionally absent: it is a frozen, non-shipping behavior
# oracle and must not be rewritten by automated dependency updates.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Singapore
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(actions)"
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:10"
      timezone: Asia/Singapore
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(rust)"
    groups:
      rust-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: pub
    directory: /apps/usque_gui
    schedule:
      interval: weekly
      day: monday
      time: "09:20"
      timezone: Asia/Singapore
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(flutter)"
    groups:
      flutter-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: gradle
    directory: /apps/usque_gui/android
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Singapore
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(android)"
    groups:
      android-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Kotlin 2.4.10 is fully supported only through AGP 9.1.x and Gradle
      # 9.5.x. Keep accepting patch releases, but defer later minor lines
      # until the upstream compatibility matrices overlap again.
      - dependency-name: com.android.application
        update-types: ["version-update:semver-minor"]
      - dependency-name: gradle-wrapper
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: nuget
    directory: /.config
    schedule:
      interval: weekly
      day: monday
      time: "09:40"
      timezone: Asia/Singapore
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(dotnet)"
    groups:
      dotnet-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # WiX 7 adopts the Open Source Maintenance Fee EULA and is not a
      # compatible upgrade for Usque's pinned WiX 5 installer toolchain.
      - dependency-name: wix
        update-types: ["version-update:semver-major"]
