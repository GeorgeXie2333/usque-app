name: PR Check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-policy:
    name: Repository policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout untrusted Pull Request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Go for actionlint
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.4
          check-latest: false

      - name: Install pinned actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

      - name: Validate title, community files, links, and Action pins
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python tool/check_repository_policy.py

      - name: Lint GitHub Actions workflows
        run: actionlint -no-color

  dependency-review:
    name: Dependency review
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown

  gate:
    name: PR Check / gate
    if: ${{ always() }}
    needs: [repository-policy, dependency-review]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every PR check
        env:
          POLICY_RESULT: ${{ needs.repository-policy.result }}
          DEPENDENCY_RESULT: ${{ needs.dependency-review.result }}
        run: |
          set -euo pipefail
          test "$POLICY_RESULT" = "success"
          test "$DEPENDENCY_RESULT" = "success" -o "$DEPENDENCY_RESULT" = "skipped"
