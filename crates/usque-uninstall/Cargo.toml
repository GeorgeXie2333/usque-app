[package]
name = "usque-uninstall"
description = "Interactive Windows uninstall confirmation helper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "usque-uninstall"
path = "src/main.rs"

[[bin]]
name = "usque-uninstall-preview"
path = "src/bin/usque-uninstall-preview.rs"
required-features = ["preview"]

[features]
preview = []

[lib]
name = "usque_uninstall"
path = "src/lib.rs"

[dependencies]
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
usque-platform = { path = "../usque-platform" }
windows-sys.workspace = true

[build-dependencies]
serde_json.workspace = true
winresource.workspace = true

[lints]
workspace = true
