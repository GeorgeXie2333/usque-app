name: Verify dev push checks

on:
  workflow_call:
    inputs:
      workflow:
        required: true
        type: string
    outputs:
      reused:
        description: A successful dev run was verified for this main push
        value: ${{ jobs.verify.outputs.reused }}

permissions:
  actions: read
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      reused: ${{ steps.lookup.outputs.reused }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: ${{ inputs.workflow }}
        run: python tool/promotion_check.py "$WORKFLOW"
