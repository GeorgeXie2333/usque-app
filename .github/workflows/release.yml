name: Public release

on:
  push:
    tags:
      - "v0.2.1"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CMAKE_GENERATOR: Ninja
  FLUTTER_COMMIT: 84fc5cbb223bc12f83d65b647ff8a56caf779ffd
  FLUTTER_VERSION: 3.44.7
  RELEASE_TAG: v0.2.1
  ANDROID_VERSION_CODE: "15"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  release-gate:
    name: Validate protected release inputs
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    env:
      WINDOWS_SIGNER_SHA256: ${{ vars.WINDOWS_SIGNER_SHA256 }}
      ANDROID_SIGNER_SHA256: ${{ vars.ANDROID_SIGNER_SHA256 }}
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Reject a mismatched or pre-approved release
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = "tag"
          test "$GITHUB_REF_NAME" = "$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          python tool/release_contract.py verify-version \
            --root . \
            --tag "$RELEASE_TAG" \
            --android-version-code "$ANDROID_VERSION_CODE"

          for value in "$WINDOWS_SIGNER_SHA256" "$ANDROID_SIGNER_SHA256"; do
            if [[ ! "$value" =~ ^[0-9A-Fa-f]{64}$ ]]; then
              echo "::error::Protected signer fingerprint variables must each contain one SHA-256 digest."
              exit 1
            fi
          done

      - name: Require this exact main commit to have a successful CI / gate workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch \
            --no-tags \
            --depth 1 \
            origin \
            +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$GITHUB_SHA" || {
            echo "::error::The release tag must point to the current main commit."
            exit 1
          }

          runs="$(
            gh api \
              --method GET \
              "/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              -f "head_sha=$GITHUB_SHA" \
              -f "status=success" \
              -f "per_page=100"
          )"
          jq -e \
            --arg sha "$GITHUB_SHA" \
            'any(.workflow_runs[]; .head_sha == $sha and .conclusion == "success" and .event == "push")' \
            <<<"$runs" >/dev/null || {
              echo "::error::No successful main CI / gate workflow exists for the exact release commit."
              exit 1
            }

  windows:
    name: Windows ${{ matrix.variant }}
    needs: release-gate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    environment: release-signing
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: x64-v2
            runner: windows-2025
            rust_target: x86_64-pc-windows-msvc
            flutter_arch: x64
            wintun_arch: amd64
            pe_arch: x64
          - variant: arm64
            runner: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
            flutter_arch: arm64
            wintun_arch: arm64
            pe_arch: arm64
    env:
      WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
      WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
      WINDOWS_SIGNER_SHA256: ${{ vars.WINDOWS_SIGNER_SHA256 }}
      WINDOWS_TIMESTAMP_URL: http://timestamp.digicert.com
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.412

      - name: Install Flutter from pinned commit
        shell: pwsh
        run: |
          $flutter = Join-Path $env:RUNNER_TEMP "flutter"
          git init $flutter
          git -C $flutter remote add origin https://github.com/flutter/flutter.git
          $tagRef = "refs/tags/$($env:FLUTTER_VERSION)"
          $refspec = "$($tagRef):$($tagRef)"
          git -C $flutter fetch --depth 1 origin $refspec
          git -C $flutter checkout --detach $tagRef
          if ((git -C $flutter rev-parse HEAD) -ne $env:FLUTTER_COMMIT) {
            throw "Flutter checkout does not match FLUTTER_COMMIT."
          }
          (Join-Path $flutter "bin") | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build locked Rust binaries
        shell: pwsh
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          rustup target add "${{ matrix.rust_target }}"
          & ./tool/build_windows_rust_release.ps1 -Variant "${{ matrix.variant }}"

      - name: Build locked Flutter host
        working-directory: apps/usque_gui
        shell: pwsh
        run: |
          flutter --suppress-analytics pub get --enforce-lockfile
          & "../../tool/prepare_windows_plugin_junctions.ps1" -FlutterProject "."
          flutter --suppress-analytics build windows --release --no-pub

      - name: Assemble unsigned application payload
        shell: pwsh
        run: |
          $releaseDirectory = (
            Resolve-Path "apps/usque_gui/build/windows/${{ matrix.flutter_arch }}/runner/Release"
          ).Path
          $payload = Join-Path $env:RUNNER_TEMP "usque-payload-${{ matrix.variant }}"
          Copy-Item $releaseDirectory $payload -Recurse
          Copy-Item `
            "target/${{ matrix.rust_target }}/release/usque-engine.exe" `
            $payload
          Copy-Item `
            "target/${{ matrix.rust_target }}/release/usque-agent.exe" `
            $payload
          Copy-Item `
            "target/${{ matrix.rust_target }}/release/usque-uninstall.exe" `
            $payload
          Copy-Item `
            "third_party/wintun-0.14.1/wintun/bin/${{ matrix.wintun_arch }}/wintun.dll" `
            $payload
          & ./tool/verify_pe_architecture.ps1 `
            -Root $payload `
            -Architecture "${{ matrix.pe_arch }}"
          $payload | Out-File -FilePath (Join-Path $env:RUNNER_TEMP "payload-path.txt")

      - name: Import protected signing identity
        shell: pwsh
        run: |
          if (
            [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PFX_BASE64) -or
            [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PFX_PASSWORD)
          ) {
            throw "Protected Windows signing secrets are missing."
          }

          $pfx = Join-Path $env:RUNNER_TEMP "usque-signing.pfx"
          [IO.File]::WriteAllBytes(
            $pfx,
            [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX_BASE64)
          )
          $password = ConvertTo-SecureString `
            $env:WINDOWS_SIGNING_PFX_PASSWORD `
            -AsPlainText `
            -Force
          $imported = @(
            Import-PfxCertificate `
              -FilePath $pfx `
              -CertStoreLocation Cert:\CurrentUser\My `
              -Password $password `
              -Exportable:$false
          )
          $certificate = $imported |
            Where-Object { $_.HasPrivateKey } |
            Select-Object -First 1
          if ($null -eq $certificate) {
            throw "PFX does not contain one private code-signing identity."
          }

          $sha = [Security.Cryptography.SHA256]::Create()
          try {
            $rawFingerprint = (
              $sha.ComputeHash($certificate.GetRawCertData()) |
                ForEach-Object { $_.ToString("X2") }
            ) -join ""
          } finally {
            $sha.Dispose()
          }
          if (
            -not [StringComparer]::OrdinalIgnoreCase.Equals(
              $rawFingerprint,
              $env:WINDOWS_SIGNER_SHA256
            )
          ) {
            throw "PFX signer does not match protected WINDOWS_SIGNER_SHA256."
          }

          $toolArch = if ($env:PROCESSOR_ARCHITECTURE -eq "ARM64") {
            "arm64"
          } else {
            "x64"
          }
          $signTool = Get-ChildItem `
            "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\$toolArch\signtool.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $signTool) { throw "SignTool was not found." }

          "USQUE_PFX_PATH=$pfx" | Out-File $env:GITHUB_ENV -Append
          "USQUE_CERT_THUMBPRINT=$($certificate.Thumbprint)" |
            Out-File $env:GITHUB_ENV -Append
          "USQUE_SIGNTOOL=$($signTool.FullName)" |
            Out-File $env:GITHUB_ENV -Append

      - name: Sign and verify every project binary
        shell: pwsh
        run: |
          $payload = Get-Content (Join-Path $env:RUNNER_TEMP "payload-path.txt")
          $officialWintun = [IO.Path]::GetFullPath(
            (Join-Path $payload "wintun.dll")
          )
          $binaries = Get-ChildItem $payload -File -Recurse |
            Where-Object { $_.Extension -in ".exe", ".dll" }
          foreach ($binary in $binaries) {
            if (
              [StringComparer]::OrdinalIgnoreCase.Equals(
                [IO.Path]::GetFullPath($binary.FullName),
                $officialWintun
              )
            ) {
              continue
            }
            & $env:USQUE_SIGNTOOL sign `
              /sha1 $env:USQUE_CERT_THUMBPRINT `
              /s My `
              /fd SHA256 `
              /tr $env:WINDOWS_TIMESTAMP_URL `
              /td SHA256 `
              $binary.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Signing failed for $($binary.FullName)."
            }
            & ./tool/verify_windows_authenticode.ps1 `
              -Path $binary.FullName `
              -SignerSha256 $env:WINDOWS_SIGNER_SHA256 `
              -AllowPinnedUntrustedRoot | Out-Null
          }

      - name: Build, inspect, and ICE-validate MSI
        shell: pwsh
        run: |
          $payload = Get-Content (Join-Path $env:RUNNER_TEMP "payload-path.txt")
          $output = Join-Path $env:RUNNER_TEMP "windows-release"
          & ./tool/build_windows_msi.ps1 `
            -Variant "${{ matrix.variant }}" `
            -AppDirectory $payload `
            -OutputDirectory $output `
            -SignerSha256 $env:WINDOWS_SIGNER_SHA256 `
            -Version $env:RELEASE_TAG `
            -AllowPinnedUntrustedRoot

      - name: Sign and verify MSI
        shell: pwsh
        run: |
          $msi = Get-ChildItem `
            (Join-Path $env:RUNNER_TEMP "windows-release") `
            -Filter "*.msi" |
            Select-Object -First 1
          if ($null -eq $msi) { throw "MSI was not produced." }
          & $env:USQUE_SIGNTOOL sign `
            /sha1 $env:USQUE_CERT_THUMBPRINT `
            /s My `
            /fd SHA256 `
            /tr $env:WINDOWS_TIMESTAMP_URL `
            /td SHA256 `
            $msi.FullName
          if ($LASTEXITCODE -ne 0) { throw "MSI signing failed." }
          & ./tool/verify_windows_authenticode.ps1 `
            -Path $msi.FullName `
            -SignerSha256 $env:WINDOWS_SIGNER_SHA256 `
            -AllowPinnedUntrustedRoot | Out-Null

      - name: Attest Windows build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/windows-release/*.msi

      - name: Upload signed Windows release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: usque-release-windows-${{ matrix.variant }}
          path: ${{ runner.temp }}/windows-release/*.msi
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing identity from runner
        if: always()
        shell: pwsh
        run: |
          $thumbprint = $env:USQUE_CERT_THUMBPRINT
          if (-not [string]::IsNullOrWhiteSpace($thumbprint)) {
            $path = "Cert:\CurrentUser\My\$thumbprint"
            if (Test-Path -LiteralPath $path) {
              Remove-Item -LiteralPath $path -Force
            }
          }
          $pfx = Join-Path $env:RUNNER_TEMP "usque-signing.pfx"
          if (Test-Path -LiteralPath $pfx) {
            Remove-Item -LiteralPath $pfx -Force
          }

  android:
    name: Android and Android TV
    needs: release-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: release-signing
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      USQUE_ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
      USQUE_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
      USQUE_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      USQUE_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
      ANDROID_SIGNER_SHA256: ${{ vars.ANDROID_SIGNER_SHA256 }}
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter from pinned commit
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" init
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin \
            "refs/tags/$FLUTTER_VERSION:refs/tags/$FLUTTER_VERSION"
          git -C "$RUNNER_TEMP/flutter" checkout --detach "refs/tags/$FLUTTER_VERSION"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_COMMIT"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Install pinned Rust and Android toolchains
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          rustup target add \
            aarch64-linux-android \
            armv7-linux-androideabi \
            x86_64-linux-android
          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$android_sdk"
          sdkmanager="$android_sdk/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          "$sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1"

      - name: Restore protected Android signing identity
        shell: bash
        run: |
          set -euo pipefail
          for value in \
            "$USQUE_ANDROID_KEYSTORE_BASE64" \
            "$USQUE_ANDROID_STORE_PASSWORD" \
            "$USQUE_ANDROID_KEY_ALIAS" \
            "$USQUE_ANDROID_KEY_PASSWORD"; do
            test -n "$value" || {
              echo "::error::Protected Android signing secrets are missing."
              exit 1
            }
          done
          keystore="$RUNNER_TEMP/usque-release.keystore"
          printf '%s' "$USQUE_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "USQUE_ANDROID_KEYSTORE=$keystore" >> "$GITHUB_ENV"

      - name: Resolve locked Flutter packages
        working-directory: apps/usque_gui
        run: flutter --suppress-analytics pub get --enforce-lockfile

      - name: Build signed split and universal APKs
        working-directory: apps/usque_gui
        env:
          USQUE_ANDROID_ABI: all
        run: |
          flutter --suppress-analytics build apk \
            --release \
            --split-per-abi \
            --target-platform android-arm,android-arm64,android-x64 \
            --no-pub
          flutter --suppress-analytics build apk \
            --release \
            --target-platform android-arm,android-arm64,android-x64 \
            --no-pub

      - name: Verify APK architectures and release hygiene
        shell: bash
        run: |
          set -euo pipefail
          source_dir="apps/usque_gui/build/app/outputs/flutter-apk"
          declare -A expected_abis=(
            [app-arm64-v8a-release.apk]="arm64-v8a"
            [app-armeabi-v7a-release.apk]="armeabi-v7a"
            [app-x86_64-release.apk]="x86_64"
            [app-release.apk]="arm64-v8a armeabi-v7a x86_64"
          )
          count=0
          for name in "${!expected_abis[@]}"; do
            apk="$source_dir/$name"
            test -s "$apk"
            entries="$RUNNER_TEMP/$name.entries"
            unzip -Z1 "$apk" > "$entries"
            actual_abis="$(
              sed -nE 's#^lib/([^/]+)/.*#\1#p' "$entries" |
                sort -u |
                paste -sd ' ' -
            )"
            test "$actual_abis" = "${expected_abis[$name]}" || {
              echo "::error::Unexpected ABI set in $name: $actual_abis"
              exit 1
            }
            for abi in ${expected_abis[$name]}; do
              grep -q "^lib/$abi/libusque_android\.so$" "$entries"
            done
            if grep -Eq 'kernel_blob\.bin|libVkLayer_khronos_validation\.so' "$entries"; then
              echo "::error::$name contains a forbidden debug artifact."
              exit 1
            fi
            while IFS= read -r library; do
              extracted="$RUNNER_TEMP/$(tr '/.' '__' <<<"$library")"
              unzip -p "$apk" "$library" > "$extracted"
              sections="$extracted.sections"
              readelf --sections "$extracted" > "$sections"
              if grep -q '\.debug_info' "$sections"; then
                echo "::error::$library in $name contains debug information."
                exit 1
              fi
            done < <(grep '/libusque_android\.so$' "$entries")
            count=$((count + 1))
          done
          test "$count" -eq 4

      - name: Preserve release APKs with fixed names
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/android-release"
          mkdir -p "$output"
          source_dir="apps/usque_gui/build/app/outputs/flutter-apk"
          cp "$source_dir/app-arm64-v8a-release.apk" \
            "$output/usque-$RELEASE_TAG-android-arm64-v8a.apk"
          cp "$source_dir/app-x86_64-release.apk" \
            "$output/usque-$RELEASE_TAG-android-x86_64.apk"
          cp "$source_dir/app-armeabi-v7a-release.apk" \
            "$output/usque-$RELEASE_TAG-android-armeabi-v7a.apk"
          cp "$source_dir/app-release.apk" \
            "$output/usque-$RELEASE_TAG-android-universal.apk"

      - name: Verify APK signatures and certificate identity
        shell: bash
        run: |
          set -euo pipefail
          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$android_sdk"
          apksigner="$android_sdk/build-tools/36.0.0/apksigner"
          test -x "$apksigner"
          expected="$(tr '[:upper:]' '[:lower:]' <<<"$ANDROID_SIGNER_SHA256")"
          count=0
          for apk in "$RUNNER_TEMP"/android-release/*.apk; do
            output="$("$apksigner" verify --verbose --print-certs "$apk")"
            printf '%s\n' "$output"
            actual="$(
              sed -nE \
                's/^Signer #1 certificate SHA-256 digest: ([0-9a-fA-F]+)$/\1/p' \
                <<<"$output" |
                head -n1 |
                tr '[:upper:]' '[:lower:]'
            )"
            test "$actual" = "$expected" || {
              echo "::error::Unexpected Android signer for $apk."
              exit 1
            }
            count=$((count + 1))
          done
          test "$count" -eq 4

      - name: Attest Android build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/android-release/*.apk

      - name: Upload signed Android release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: usque-release-android
          path: ${{ runner.temp }}/android-release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Remove Android signing material
        if: always()
        run: |
          if [[ -n "${USQUE_ANDROID_KEYSTORE:-}" && -f "$USQUE_ANDROID_KEYSTORE" ]]; then
            rm -f -- "$USQUE_ANDROID_KEYSTORE"
          fi

  stage-candidate:
    name: Stage signed packages and attest SBOMs
    needs: [release-gate, windows, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      WINDOWS_SIGNER_SHA256: ${{ vars.WINDOWS_SIGNER_SHA256 }}
      ANDROID_SIGNER_SHA256: ${{ vars.ANDROID_SIGNER_SHA256 }}
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download every signed artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: usque-release-*
          path: ${{ runner.temp }}/candidate
          merge-multiple: true

      - name: Install pinned Syft
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.44.0

      - name: Generate per-artifact SPDX for GitHub attestations
        shell: bash
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/candidate"
          count=0
          while IFS= read -r -d '' artifact; do
            context="$(mktemp -d "$RUNNER_TEMP/sbom-context.XXXXXX")"
            cp "$artifact" "$context/"
            cp Cargo.lock "$context/"
            cp apps/usque_gui/pubspec.lock "$context/"
            cp apps/usque_gui/pubspec.yaml "$context/"
            cp LICENSE.md "$context/"
            cp third_party/wintun-0.14.1/wintun/LICENSE.txt \
              "$context/WINTUN-LICENSE.txt"
            "$SYFT" scan "dir:$context" \
              -o "spdx-json=$artifact.spdx.json"
            test -s "$artifact.spdx.json"
            rm -rf -- "$context"
            count=$((count + 1))
          done < <(
            find "$candidate" -maxdepth 1 -type f \
              \( -name '*.msi' -o -name '*.apk' \) \
              -print0 |
              sort -z
          )
          test "$count" -eq 6

      - name: Create immutable release manifest
        run: |
          python tool/release_contract.py create-manifest \
            --directory "$RUNNER_TEMP/candidate" \
            --tag "$RELEASE_TAG" \
            --commit "$GITHUB_SHA" \
            --windows-signer-sha256 "$WINDOWS_SIGNER_SHA256" \
            --android-signer-sha256 "$ANDROID_SIGNER_SHA256" \
            --output "$RUNNER_TEMP/candidate/release-manifest.json"
          python tool/release_contract.py verify-artifacts \
            --directory "$RUNNER_TEMP/candidate" \
            --manifest "$RUNNER_TEMP/candidate/release-manifest.json"

      - name: Attest x64-v2 MSI SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/candidate/usque-${{ env.RELEASE_TAG }}-windows-x64-v2.msi
          sbom-path: ${{ runner.temp }}/candidate/usque-${{ env.RELEASE_TAG }}-windows-x64-v2.msi.spdx.json

      - name: Attest ARM64 MSI SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/candidate/usque-${{ env.RELEASE_TAG }}-windows-arm64.msi
          sbom-path: ${{ runner.temp }}/candidate/usque-${{ env.RELEASE_TAG }}-windows-arm64.msi.spdx.json

      - name: Attest arm64-v8a APK SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/candidate/usque-${{ env.RELEASE_TAG }}-android-arm64-v8a.apk
          sbom-path: ${{ runner.temp }}/candidate/usque-${{ env.RELEASE_TAG }}-android-arm64-v8a.apk.spdx.json

      - name: Attest Android x86_64 APK SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/candidate/usque-${{ env.RELEASE_TAG }}-android-x86_64.apk
          sbom-path: ${{ runner.temp }}/candidate/usque-${{ env.RELEASE_TAG }}-android-x86_64.apk.spdx.json

      - name: Attest Android armeabi-v7a APK SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/candidate/usque-${{ env.RELEASE_TAG }}-android-armeabi-v7a.apk
          sbom-path: ${{ runner.temp }}/candidate/usque-${{ env.RELEASE_TAG }}-android-armeabi-v7a.apk.spdx.json

      - name: Attest Android universal APK SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/candidate/usque-${{ env.RELEASE_TAG }}-android-universal.apk
          sbom-path: ${{ runner.temp }}/candidate/usque-${{ env.RELEASE_TAG }}-android-universal.apk.spdx.json

      - name: Upload exact release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: usque-release-candidate
          path: ${{ runner.temp }}/candidate
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Reverify and publish release
    needs: stage-candidate
    runs-on: ubuntu-24.04
    environment: release-publish
    permissions:
      contents: write
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download exact candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: usque-release-candidate
          path: ${{ runner.temp }}/candidate

      - name: Reverify exact artifacts before publication
        run: |
          set -euo pipefail
          python tool/release_contract.py verify-artifacts \
            --directory "$RUNNER_TEMP/candidate" \
            --manifest "$RUNNER_TEMP/candidate/release-manifest.json"
          publish="$RUNNER_TEMP/publish"
          mkdir -p "$publish"
          while IFS= read -r -d '' artifact; do
            cp -- "$artifact" "$publish/"
          done < <(
            find "$RUNNER_TEMP/candidate" -maxdepth 1 -type f \
              \( -name '*.msi' -o -name '*.apk' \) \
              -print0 |
              sort -z
          )
          test "$(find "$publish" -maxdepth 1 -type f | wc -l)" -eq 6

      - name: Publish GitHub release only after signing and supply-chain gates
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: ${{ env.RELEASE_TAG }}
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          draft: false
          make_latest: true
          fail_on_unmatched_files: true
          generate_release_notes: true
          previous_tag: v0.2.0
          body: |
            ## Highlights

            - GeoSite and GeoIP direct routing now covers Android VPN, Windows TUN, SOCKS5, and HTTP, with Split DNS classifying domains before WARP DNS.
            - Country rules can be downloaded while disconnected, using validated GeoIP data and the full V2Fly GeoSite database.
            - Direct-country controls now live on a dedicated Settings page, alongside DNS hinting, network-change cleanup, and transport hardening.

            ## DNS privacy

            GeoSite-matched DNS queries use the current physical network DNS and can be visible to that network. Apps using their own DoH or DoT hide the domain from Usque, so those connections fall back to GeoIP routing.

            ## Official signer fingerprints

            - Windows Authenticode certificate SHA-256: `${{ vars.WINDOWS_SIGNER_SHA256 }}`
            - Android release certificate SHA-256: `${{ vars.ANDROID_SIGNER_SHA256 }}`
          files: ${{ runner.temp }}/publish/*
