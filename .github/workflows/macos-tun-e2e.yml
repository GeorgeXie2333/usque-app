name: macOS TUN network acceptance

on:
  workflow_call:
    inputs:
      live_warp:
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  RUSTUP_TOOLCHAIN: 1.97.1

jobs:
  observer:
    if: ${{ !inputs.live_warp }}
    name: Independent HTTPS receiver
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start an isolated marker receiver
        run: |
          dir="$RUNNER_TEMP/observer"
          python3 -u tool/macos_tun_observer.py serve "$dir" > "$RUNNER_TEMP/observer.log" 2>&1 &
          pid=$!
          # Allow the verified download, three 90-second attempts, and retry backoff.
          for ((attempt = 0; attempt < 410; attempt++)); do
            if test -s "$dir/endpoint.json"; then cat "$RUNNER_TEMP/observer.log"; exit 0; fi
            if ! kill -0 "$pid" 2>/dev/null; then cat "$RUNNER_TEMP/observer.log"; exit 1; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/observer.log"
          echo "Timed out starting the external receiver" >&2
          exit 1
      - name: Make the per-run canary endpoint available to the Mac jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-tun-observer-${{ github.run_attempt }}
          path: ${{ runner.temp }}/observer/endpoint.json
          if-no-files-found: error
          retention-days: 1
      - name: Verify external observations and both positive controls for each architecture
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tool/macos_tun_observer.py wait "$RUNNER_TEMP/observer"
      - name: Preserve receiver counts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-tun-receipts-${{ github.run_attempt }}
          path: ${{ runner.temp }}/observer/report.json
          retention-days: 14

  network:
    name: macOS TUN E2E (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record the disposable runner baseline
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(uname -m)" = "$EXPECTED_ARCH"
          sw_vers
          uname -m
          df -h "$RUNNER_TEMP"
          route -n get default | awk '/gateway:|interface:/'
          scutil --dns | awk '/resolver #|nameserver\[|if_index|flags|reach/'
          sudo -n /sbin/pfctl -si | head -n 2
          sudo -n /sbin/pfctl -sr
          sudo -n /sbin/pfctl -sn
          sudo -n /sbin/pfctl -a com.apple -s Anchors
          sudo -n /sbin/pfctl -ss | wc -l
      - name: Install the repository Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Restore native Cargo build dependencies
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            target/debug
          key: tun-e2e-v1-${{ matrix.runner }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-deps
          restore-keys: tun-e2e-v1-${{ matrix.runner }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
      - name: Build ordinary-user Engine and privileged Agent with test TUN enabled
        id: native_build
        run: |
          cargo build --locked --no-default-features -p usque-engine -p usque-agent \
            --features usque-engine/macos-test-tun,usque-agent/macos-test-tun \
            --bin usque-engine --bin usque-agent
          cargo test --locked --no-default-features -p usque-engine --features macos-test-tun \
            --test macos_tun_exit --no-run --message-format=json-render-diagnostics > "$RUNNER_TEMP/engine-build.jsonl"
          cargo test --locked -p usque-agent --features macos-test-tun --lib \
            --no-run --message-format=json-render-diagnostics > "$RUNNER_TEMP/agent-build.jsonl"
          for pair in 'engine macos_tun_exit' 'agent usque_agent'; do
            read -r package name <<< "$pair"
            jq -ers --arg name "$name" '
              map(select(.reason == "compiler-artifact" and .target.name == $name
                         and .profile.test and .executable != null))
              | if length == 1 then .[0].executable else error("expected one test binary") end
            ' "$RUNNER_TEMP/$package-build.jsonl" > "$RUNNER_TEMP/$package-test-path"
          done
      - name: Save native dependencies before fault injection
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            target/debug
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Install Go for the disposable CONNECT-IP peer
        if: ${{ !inputs.live_warp }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.4
          check-latest: false
          cache: false
      - name: Compile the native test peer before changing network settings
        if: ${{ !inputs.live_warp }}
        env:
          GOTOOLCHAIN: local
          GOPROXY: 'off'
        run: |
          go test tool/macos_tun_engine_peer.go tool/macos_tun_engine_peer_test.go
          go build -o "$RUNNER_TEMP/connect-ip-peer" tool/macos_tun_engine_peer.go
      - name: Exercise endpoint refusal, CONNECT-IP packet flow, peer loss and GUI disconnect
        if: ${{ !inputs.live_warp }}
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          USQUE_DISPOSABLE_MAC: '1'
          USQUE_TEST_PEER: ${{ runner.temp }}/connect-ip-peer
        run: |
          python3 tool/macos_tun_deadline.py bash tool/macos_tun_engine.sh target/debug/usque-engine target/debug/usque-agent \
            "$(cat "$RUNNER_TEMP/engine-test-path")"
      - name: Register a real WARP Consumer device and verify tunnel traffic and disconnect
        if: inputs.live_warp
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          USQUE_DISPOSABLE_MAC: '1'
          USQUE_TEST_LIVE_WARP: '1'
        run: |
          python3 tool/macos_tun_deadline.py bash tool/macos_tun_engine.sh target/debug/usque-engine target/debug/usque-agent \
            "$(cat "$RUNNER_TEMP/engine-test-path")"
      - name: Locate the independent receiver and pin the physical probe destination
        id: receiver
        if: ${{ !cancelled() && !inputs.live_warp && steps.native_build.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          USQUE_TUN_OBSERVER_CONFIG: ${{ runner.temp }}/observer/client.json
        run: |
          dir="$RUNNER_TEMP/observer"
          mkdir -p "$dir"
          for ((attempt = 0; attempt < 44; attempt++)); do
            if gh run download "$GITHUB_RUN_ID" -n "macos-tun-observer-$GITHUB_RUN_ATTEMPT" -D "$dir"; then break; fi
            sleep 10
          done
          python3 tool/macos_tun_observer.py prepare "$dir/endpoint.json"
      - name: Check physical probes during active and retained protection, then verify DNS and route restoration
        if: ${{ !cancelled() && steps.receiver.outcome == 'success' }}
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          USQUE_DISPOSABLE_MAC: '1'
          USQUE_TUN_OBSERVER_CONFIG: ${{ runner.temp }}/observer/client.json
        run: |
          set -euo pipefail
          wire() {
            sudo -n /usr/bin/env USQUE_DISPOSABLE_MAC=1 GITHUB_ACTIONS=true RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
              USQUE_TUN_OBSERVER_CONFIG="$USQUE_TUN_OBSERVER_CONFIG" "$GITHUB_WORKSPACE/tool/macos_tun_wire.py" "$1"
          }
          trap 'wire cleanup' EXIT
          observer="$GITHUB_WORKSPACE/tool/macos_tun_wire.py"
          wire_ready=true
          if ! wire setup; then
            echo "::error::Dual-stack capture setup failed; collecting the independent HTTPS evidence and native recovery result"
            wire_ready=false
            observer="$GITHUB_WORKSPACE/tool/macos_tun_observer.py"
          fi
          name=macos::backend::disposable::configured_tun_disconnect_restores_network
          python3 tool/macos_tun_deadline.py sudo -n /usr/bin/env USQUE_DISPOSABLE_MAC=1 GITHUB_ACTIONS=true RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            USQUE_TUN_OBSERVER="$observer" \
            USQUE_TUN_OBSERVER_CONFIG="$USQUE_TUN_OBSERVER_CONFIG" "$(cat "$RUNNER_TEMP/agent-test-path")" \
            --ignored --exact "$name" --test-threads=1 --nocapture --format=pretty --color=never \
            | tee "$RUNNER_TEMP/configured-result.txt"
          grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/configured-result.txt"
          test "$wire_ready" = true
      - name: Confirm ordinary DNS and default-route HTTPS after explicit disconnect
        if: ${{ !cancelled() && steps.receiver.outcome == 'success' }}
        env:
          USQUE_TUN_OBSERVER_CONFIG: ${{ runner.temp }}/observer/client.json
        run: python3 tool/macos_tun_observer.py finish
      - name: Preserve synthetic receive-side probes
        if: ${{ always() && !inputs.live_warp }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-tun-wire-${{ matrix.arch }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/observer/wire/*.pcap
            ${{ runner.temp }}/observer/wire/before.json
            ${{ runner.temp }}/observer/wire/active.json
            ${{ runner.temp }}/observer/wire/retained.json
            ${{ runner.temp }}/observer/wire/after.json
          retention-days: 14
