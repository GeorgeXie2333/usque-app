name: Linux packages

on:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
    secrets:
      LINUX_SIGNING_KEY_BASE64:
        required: false

permissions:
  contents: read

env:
  FLUTTER_COMMIT: 84fc5cbb223bc12f83d65b647ff8a56caf779ffd
  FLUTTER_VERSION: 3.44.7
  CMAKE_GENERATOR: Ninja

jobs:
  packages:
    name: Linux ${{ matrix.architecture }} AppImage deb rpm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    environment: ${{ inputs.release && 'release-signing' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            flutter_arch: x64
          - architecture: arm64
            runner: ubuntu-22.04-arm
            rust_target: aarch64-unknown-linux-gnu
            flutter_arch: arm64
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install baseline build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev liblzma-dev libstdc++-12-dev libclang-dev rpm libarchive-tools squashfs-tools desktop-file-utils openssl

      - name: Install locked Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          rustup target add --toolchain 1.97.1 "${{ matrix.rust_target }}"

      - name: Install exact Flutter revision
        run: |
          set -euo pipefail
          flutter_root="$RUNNER_TEMP/flutter"
          git init "$flutter_root"
          git -C "$flutter_root" remote add origin https://github.com/flutter/flutter.git
          git -C "$flutter_root" fetch --depth 1 origin \
            "refs/tags/$FLUTTER_VERSION:refs/tags/$FLUTTER_VERSION"
          git -C "$flutter_root" checkout --detach "refs/tags/$FLUTTER_VERSION"
          test "$(git -C "$flutter_root" rev-parse HEAD)" = "$FLUTTER_COMMIT"
          echo "$flutter_root/bin" >> "$GITHUB_PATH"
          echo "flutter.sdk=$flutter_root" > apps/usque_gui/android/local.properties

      - name: Compile and test native Rust without system mutations
        env:
          USQUE_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          if [ "$USQUE_ARCHITECTURE" = amd64 ]; then
            export RUSTFLAGS='-C target-cpu=x86-64'
            export CFLAGS='-march=x86-64 -mtune=generic'
            export CXXFLAGS='-march=x86-64 -mtune=generic'
          fi
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked
          cargo build --release --locked --target "${{ matrix.rust_target }}" -p usque-engine -p usque-agent -p usque-update

      - name: Build real desktop and separate debug preview
        working-directory: apps/usque_gui
        run: |
          flutter --suppress-analytics pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --no-pub
          flutter test --no-pub --exclude-tags golden
          flutter build linux --debug --no-pub -t lib/main_preview.dart
          flutter build linux --release --no-pub -t lib/main.dart
          cmake --build "build/linux/${{ matrix.flutter_arch }}/release" --target usque_linux_socket_test
          "build/linux/${{ matrix.flutter_arch }}/release/runner/usque_linux_socket_test"

      - name: Generate ephemeral compile-only signing identity
        if: ${{ !inputs.release }}
        run: |
          umask 077
          openssl genpkey -algorithm ED25519 -out "$RUNNER_TEMP/linux-signing.pem"

      - name: Materialize protected Linux release signing identity
        if: ${{ inputs.release }}
        env:
          LINUX_SIGNING_KEY_BASE64: ${{ secrets.LINUX_SIGNING_KEY_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$LINUX_SIGNING_KEY_BASE64"
          printf '%s' "$LINUX_SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/linux-signing.pem"

      - name: Package and verify architecture and baseline
        env:
          RELEASE_BUILD: ${{ inputs.release }}
        run: |
          set -euo pipefail
          version="$(python3 -c 'import re,pathlib; print(re.search(r"(?ms)^\[workspace.package\].*?^version = \"([^\"]+)\"", pathlib.Path("Cargo.toml").read_text())[1])')"
          extra=()
          if [ "$RELEASE_BUILD" != true ]; then extra+=(--test-signing); fi
          python3 tool/linux_package.py \
            --bundle "apps/usque_gui/build/linux/${{ matrix.flutter_arch }}/release/bundle" \
            --rust "target/${{ matrix.rust_target }}/release" \
            --output "$RUNNER_TEMP/linux-packages" \
            --architecture "${{ matrix.architecture }}" --version "$version" \
            --signing-key "$RUNNER_TEMP/linux-signing.pem" "${extra[@]}"

      - name: Remove temporary signing identity
        if: ${{ always() }}
        run: rm -f -- "$RUNNER_TEMP/linux-signing.pem"

      - name: Retain package validation and exact signed artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.release && 'usque-release' || 'usque-build' }}-linux-${{ matrix.architecture }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/linux-packages/*.AppImage
            ${{ runner.temp }}/linux-packages/*.deb
            ${{ runner.temp }}/linux-packages/*.rpm
            ${{ runner.temp }}/linux-packages/*.manifest.json
            ${{ runner.temp }}/linux-packages/*.manifest.json.sig
            ${{ runner.temp }}/linux-packages/*-elf.json
            ${{ runner.temp }}/linux-packages/TEST-IDENTITY-DO-NOT-PUBLISH
