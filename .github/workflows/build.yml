name: Build

on:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CMAKE_GENERATOR: Ninja
  FLUTTER_COMMIT: 84fc5cbb223bc12f83d65b647ff8a56caf779ffd
  FLUTTER_VERSION: 3.44.7

jobs:
  linux:
    name: Linux compile and packages
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    uses: ./.github/workflows/linux.yml

  windows:
    name: Windows ${{ matrix.label }} compile
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      attestations: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x64-v2
            variant: x64-v2
            runner: windows-2025
            rust_target: x86_64-pc-windows-msvc
            flutter_arch: x64
            wintun_arch: amd64
            pe_arch: x64
            run_clippy: true
          - label: ARM64
            variant: arm64
            runner: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
            flutter_arch: arm64
            wintun_arch: arm64
            pe_arch: arm64
            run_clippy: false
    steps:
      - name: Checkout untrusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Python
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.10"

      - name: Verify vendored native sources and notices
        run: python tool/check_openvpn_sources.py

      - name: Install Java for Android SDK tooling
        if: matrix.variant == 'x64-v2'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter from pinned commit
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $flutter = Join-Path $env:RUNNER_TEMP "flutter"
          git init $flutter
          git -C $flutter remote add origin https://github.com/flutter/flutter.git
          $tagRef = "refs/tags/$($env:FLUTTER_VERSION)"
          $refspec = "$($tagRef):$($tagRef)"
          git -C $flutter fetch --depth 1 origin $refspec
          git -C $flutter checkout --detach $tagRef
          if ((git -C $flutter rev-parse HEAD) -ne $env:FLUTTER_COMMIT) {
            throw "Flutter revision mismatch."
          }
          (Join-Path $flutter "bin") | Out-File -FilePath $env:GITHUB_PATH -Append
          "USQUE_FLUTTER_ROOT=$flutter" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install pinned Rust and native build tools
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          rustup default 1.97.1
          rustup target add "${{ matrix.rust_target }}"

      - name: Install pinned Android SDK CMake for x64 build
        if: matrix.variant == 'x64-v2'
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $androidSdk = if (-not [string]::IsNullOrWhiteSpace($env:ANDROID_SDK_ROOT)) {
            $env:ANDROID_SDK_ROOT
          } else {
            $env:ANDROID_HOME
          }
          if ([string]::IsNullOrWhiteSpace($androidSdk)) {
            throw "Android SDK root is unavailable."
          }
          $sdkManager = Join-Path $androidSdk "cmdline-tools\latest\bin\sdkmanager.bat"
          if (-not (Test-Path -LiteralPath $sdkManager -PathType Leaf)) {
            throw "sdkmanager.bat was not found at $sdkManager"
          }
          & $sdkManager "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Create ignored local SDK configuration
        if: matrix.variant == 'x64-v2'
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $androidSdk = $env:ANDROID_SDK_ROOT
          if ([string]::IsNullOrWhiteSpace($androidSdk)) {
            $androidSdk = $env:ANDROID_HOME
          }
          if ([string]::IsNullOrWhiteSpace($androidSdk)) {
            throw "Android SDK root is unavailable."
          }
          $escape = {
            param([string]$Value)
            $Value.Replace("\", "\\").Replace(":", "\:")
          }
          $properties = @(
            "sdk.dir=$(& $escape $androidSdk)"
            "flutter.sdk=$(& $escape $env:USQUE_FLUTTER_ROOT)"
          )
          Set-Content apps/usque_gui/android/local.properties $properties -Encoding utf8NoBOM

      - name: Clippy Windows workspace through pinned helper
        if: matrix.run_clippy
        shell: pwsh
        run: ./tool/build_windows_rust_release.ps1 -Variant "${{ matrix.variant }}" -CargoAction clippy

      # These deterministic tests do not create a TUN or mutate host networking.
      # The Ubuntu CI suite cannot execute cfg(windows) DNS/recovery tests.
      - name: Test Windows workspace through pinned helper
        if: matrix.variant == 'x64-v2'
        shell: pwsh
        run: ./tool/build_windows_rust_release.ps1 -Variant "${{ matrix.variant }}" -CargoAction test

      - name: Build Windows engine and Agent through pinned helper
        shell: pwsh
        run: ./tool/build_windows_rust_release.ps1 -Variant "${{ matrix.variant }}"

      - name: Compile native setup interface and run inert tests
        shell: pwsh
        run: |
          & ./tool/build_windows_bootstrapper.ps1 `
            -Variant "${{ matrix.variant }}" `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP "windows-bootstrapper-${{ matrix.variant }}") `
            -Test

      - name: Restore verified patched Flutter Windows engine or build from source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tool/flutter_windows_engine.py verify-framework "$env:USQUE_FLUTTER_ROOT"
          if ($LASTEXITCODE -ne 0) { throw "Flutter framework and engine recipe differ." }
          $engineDirectory = Join-Path $env:RUNNER_TEMP ("engine-package-" + [Guid]::NewGuid().ToString("N"))
          $restoreText = python tool/flutter_windows_release_engine.py restore `
            --architecture "${{ matrix.flutter_arch }}" --destination $engineDirectory --commit "$env:GITHUB_SHA" 2>&1
          $legacyExit = $LASTEXITCODE
          if ($legacyExit -ne 0 -and $legacyExit -ne 3) { throw "Reviewed engine integrity or provenance validation failed: $restoreText" }
          $version = ((Get-Content apps/usque_gui/pubspec.yaml | Where-Object { $_ -match '^version: ' }) -replace '^version:\s*', '').Trim()
          if ($legacyExit -eq 3 -and $version -eq '0.3.4+30' -and $env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and $env:GITHUB_REF -in @('refs/heads/dev', 'refs/heads/main')) {
            throw "The v0.3.4 release candidate must reuse the reviewed engine inputs."
          }
          if ($legacyExit -eq 0) {
            $restore = $restoreText -join "`n" | ConvertFrom-Json
            "USQUE_ENGINE_RESTORE_MODE=legacy" | Out-File -FilePath $env:GITHUB_ENV -Append
            "Reused verified engine: artifact $($restore.artifact_id), producer run $($restore.producer_run_id)" |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          } else {
            "USQUE_ENGINE_RESTORE_MODE=current" | Out-File -FilePath $env:GITHUB_ENV -Append
            $restoreText = python tool/flutter_windows_engine_package.py restore `
              --architecture "${{ matrix.flutter_arch }}" --destination $engineDirectory
            if ($LASTEXITCODE -ne 0) { throw "Engine package integrity or provenance validation failed." }
            $restore = $restoreText -join "`n" | ConvertFrom-Json
            if (-not $restore.restored) {
              "Engine package unavailable for these inputs; compiling fresh sources and applicable native tests." |
                Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              $selectionText = python tool/flutter_windows_engine.py create-build-directory `
                --parent "$env:RUNNER_TEMP" --parent "$env:LOCALAPPDATA"
              if ($LASTEXITCODE -ne 0) { throw "A fresh engine build directory with at least 40 GiB free is required." }
              $engineDirectory = ($selectionText -join "`n" | ConvertFrom-Json).path
              $runEngineTests = "${{ matrix.flutter_arch }}" -eq "x64"
              & ./tool/build_flutter_windows_engine.ps1 `
                -Architecture "${{ matrix.flutter_arch }}" `
                -BuildDirectory $engineDirectory -Jobs 2 -RunTests:$runEngineTests `
                -Python "${{ steps.python.outputs.python-path }}"
            }
          }
          "USQUE_FLUTTER_ENGINE_ROOT=$engineDirectory" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Flutter Windows Release
        working-directory: apps/usque_gui
        shell: pwsh
        run: |
          $engineSource = Join-Path $env:USQUE_FLUTTER_ENGINE_ROOT "flutter/engine/src"
          $engineRecipe = Get-Content ../../tool/flutter_windows_engine_manifest.json -Raw | ConvertFrom-Json
          $localEngine = $engineRecipe.architectures."${{ matrix.flutter_arch }}"
          $engineArguments = @("--local-engine-src-path=$engineSource", "--local-engine=$localEngine", "--local-engine-host=$localEngine")
          flutter --suppress-analytics @engineArguments pub get --enforce-lockfile
          if ($LASTEXITCODE -ne 0) { throw "Flutter dependency resolution failed." }
          & ../../tool/prepare_windows_plugin_junctions.ps1 -FlutterProject .
          $symbolDirectory = Join-Path $env:RUNNER_TEMP "flutter-symbols-windows-${{ matrix.variant }}"
          flutter --suppress-analytics @engineArguments build windows --release --no-pub --split-debug-info="$symbolDirectory"
          if ($LASTEXITCODE -ne 0) { throw "Flutter Windows build failed." }
          cmake --build "build/windows/${{ matrix.flutter_arch }}" --config Release --target usque_proton_verification_test
          if ($LASTEXITCODE -ne 0) { throw "Proton policy fixture build failed." }
          & "./build/windows/${{ matrix.flutter_arch }}/tests/Release/usque_proton_verification_test.exe"
          if ($LASTEXITCODE -ne 0) { throw "Proton policy fixture failed." }
          cmake --build "build/windows/${{ matrix.flutter_arch }}" --config Release --target usque_proton_webview_test
          if ($LASTEXITCODE -ne 0) { throw "Proton cross-origin WebView fixture build failed." }
          & "./build/windows/${{ matrix.flutter_arch }}/tests/Release/usque_proton_webview_test.exe"
          if ($LASTEXITCODE -ne 0) { throw "Proton cross-origin WebView fixture failed." }
          $version = ((Get-Content pubspec.yaml | Where-Object { $_ -match '^version: ' }) -replace '^version:\s*', '').Trim()
          $sourceCommit = (git rev-parse HEAD).Trim()
          python ../../tool/archive_flutter_symbols.py archive `
            --artifact "build/windows/${{ matrix.flutter_arch }}/runner/Release/data/app.so" `
            --symbols $symbolDirectory `
            --output "$env:RUNNER_TEMP/flutter-symbol-archives" `
            --version $version --source-commit $sourceCommit `
            --platform windows --kind windows --architecture "windows-${{ matrix.flutter_arch }}"
          if ($LASTEXITCODE -ne 0) { throw "Flutter symbol validation failed." }
          $engineSymbols = Join-Path $env:RUNNER_TEMP "flutter-symbol-archives/windows-engine-${{ matrix.variant }}"
          New-Item -ItemType Directory -Path $engineSymbols -Force | Out-Null
          Copy-Item (Join-Path $env:USQUE_FLUTTER_ENGINE_ROOT "engine-build-${{ matrix.flutter_arch }}.json") $engineSymbols
          Copy-Item (Join-Path $engineSource "out/$localEngine/flutter_windows.dll.pdb") $engineSymbols
          if ($env:USQUE_ENGINE_RESTORE_MODE -eq 'legacy') {
            Copy-Item (Join-Path $env:USQUE_FLUTTER_ENGINE_ROOT "engine-restore.json") $engineSymbols
          }

      # These tests use fake engines and inert shell fixtures, not a live VPN.
      - name: Run Windows runner and shell integration tests
        shell: pwsh
        run: |
          $testExecutable = "apps/usque_gui/build/windows/${{ matrix.flutter_arch }}/tests/Release/usque_zero_trust_test.exe"
          if (-not (Test-Path -LiteralPath $testExecutable -PathType Leaf)) {
            throw "Windows runner test executable was not built: $testExecutable"
          }
          & $testExecutable
          if ($LASTEXITCODE -ne 0) { throw "Windows runner tests failed: $LASTEXITCODE" }

      - name: Assemble and verify compile-only application directory
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $directory = (
            Resolve-Path "apps/usque_gui/build/windows/${{ matrix.flutter_arch }}/runner/Release"
          ).Path
          if ($env:USQUE_ENGINE_RESTORE_MODE -eq 'legacy') {
            python tool/flutter_windows_release_engine.py verify-staged `
              --dll (Join-Path $directory "flutter_windows.dll") --build-root "$env:USQUE_FLUTTER_ENGINE_ROOT" `
              --architecture "${{ matrix.flutter_arch }}" --commit "$env:GITHUB_SHA"
          } else {
            python tool/flutter_windows_engine.py verify-staged `
              --dll (Join-Path $directory "flutter_windows.dll") `
              --build-manifest (Join-Path $env:USQUE_FLUTTER_ENGINE_ROOT "engine-build-${{ matrix.flutter_arch }}.json") `
              --architecture "${{ matrix.flutter_arch }}"
          }
          if ($LASTEXITCODE -ne 0) { throw "Application does not contain the verified patched engine." }
          Copy-Item `
            "target/${{ matrix.rust_target }}/release/usque-engine.exe" `
            $directory
          Copy-Item `
            "target/${{ matrix.rust_target }}/release/usque-agent.exe" `
            $directory
          Copy-Item `
            "target/${{ matrix.rust_target }}/release/usque-uninstall.exe" `
            $directory
          Copy-Item `
            "target/${{ matrix.rust_target }}/release/usque-update.exe" `
            $directory
          Copy-Item `
            "third_party/wintun-0.14.1/wintun/bin/${{ matrix.wintun_arch }}/wintun.dll" `
            $directory
          $required = @(
            "usque.exe"
            "usque-engine.exe"
            "usque-agent.exe"
            "usque-uninstall.exe"
            "usque-update.exe"
            "wintun.dll"
            "flutter_windows.dll"
            "data"
          )
          foreach ($name in $required) {
            $path = Join-Path $directory $name
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Compile-only Windows output is missing $name."
            }
          }
          & ./tool/verify_pe_architecture.ps1 `
            -Root $directory `
            -Architecture "${{ matrix.pe_arch }}"
          Write-Output "WINDOWS_BUILD_OK=$directory"

      - name: Preserve matching Windows Flutter symbols separately
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: usque-flutter-symbols-windows-${{ matrix.variant }}
          path: ${{ runner.temp }}/flutter-symbol-archives
          if-no-files-found: error
          retention-days: 90

      - name: Remove local build configuration
        if: ${{ always() }}
        shell: pwsh
        run: Remove-Item apps/usque_gui/android/local.properties -Force -ErrorAction SilentlyContinue

  android:
    name: Android ARMv8, x64, ARMv7, and universal compile
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout untrusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify vendored native sources and notices
        run: python tool/check_openvpn_sources.py

      - name: Install Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter from pinned commit
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" init
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin \
            "refs/tags/$FLUTTER_VERSION:refs/tags/$FLUTTER_VERSION"
          git -C "$RUNNER_TEMP/flutter" checkout --detach "refs/tags/$FLUTTER_VERSION"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_COMMIT"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Install pinned Rust and Android toolchains
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component clippy
          rustup default 1.97.1
          rustup target add \
            aarch64-linux-android \
            armv7-linux-androideabi \
            x86_64-linux-android
          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$android_sdk"
          sdkmanager="$android_sdk/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          "$sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1"

      - name: Clippy Android Rust
        shell: pwsh
        run: ./tool/build_android_rust.ps1 -AbiFilter arm64-v8a -CargoAction clippy

      - name: Resolve locked Flutter packages
        working-directory: apps/usque_gui
        run: flutter --suppress-analytics pub get --enforce-lockfile

      - name: Create ephemeral build-only signing identity
        env:
          STORE_PASSWORD: usque-build-only-password
        run: |
          set -euo pipefail
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/usque-build-only.jks" \
            -storepass "$STORE_PASSWORD" \
            -keypass "$STORE_PASSWORD" \
            -alias usque-build-only \
            -keyalg RSA \
            -keysize 3072 \
            -validity 1 \
            -dname "CN=Untrusted Usque CI Build, O=Usque Development, C=XX"

      - name: Build split and universal Release APKs without release secrets
        working-directory: apps/usque_gui
        env:
          USQUE_ANDROID_ABI: all
          USQUE_ANDROID_KEYSTORE: ${{ runner.temp }}/usque-build-only.jks
          USQUE_ANDROID_STORE_PASSWORD: usque-build-only-password
          USQUE_ANDROID_KEY_ALIAS: usque-build-only
          USQUE_ANDROID_KEY_PASSWORD: usque-build-only-password
        run: |
          set -euo pipefail
          symbol_root="$RUNNER_TEMP/flutter-symbols-android"
          mkdir -p "$symbol_root/split" "$symbol_root/universal"
          # Match the release workflow's compiler reuse and separate snapshots.
          flutter --suppress-analytics build apk \
            --release \
            --split-per-abi \
            --target-platform android-arm,android-arm64,android-x64 \
            --split-debug-info="$symbol_root/build" \
            --no-pub
          cp -- "$symbol_root"/build/*.symbols "$symbol_root/split/"
          flutter --suppress-analytics build apk \
            --release \
            --target-platform android-arm,android-arm64,android-x64 \
            --split-debug-info="$symbol_root/build" \
            --no-pub
          cp -- "$symbol_root"/build/*.symbols "$symbol_root/universal/"

      - name: Verify all APK architectures and release hygiene
        run: |
          set -euo pipefail
          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$android_sdk"
          apksigner="$android_sdk/build-tools/36.0.0/apksigner"
          test -x "$apksigner"
          source_dir=apps/usque_gui/build/app/outputs/flutter-apk
          base_version_code="$(sed -nE 's/^version: [^+]+\+([0-9]+)\r?$/\1/p' apps/usque_gui/pubspec.yaml)"
          [[ "$base_version_code" =~ ^[1-9][0-9]*$ ]]
          declare -A abi_codes=(
            [app-arm64-v8a-release.apk]=2
            [app-armeabi-v7a-release.apk]=1
            [app-x86_64-release.apk]=4
            [app-release.apk]=0
          )
          declare -A expected_abis=(
            [app-arm64-v8a-release.apk]="arm64-v8a"
            [app-armeabi-v7a-release.apk]="armeabi-v7a"
            [app-x86_64-release.apk]="x86_64"
            [app-release.apk]="arm64-v8a armeabi-v7a x86_64"
          )
          count=0
          for name in "${!expected_abis[@]}"; do
            apk="$source_dir/$name"
            test -s "$apk"
            read -r -a package_abis <<< "${expected_abis[$name]}"
            python tool/verify_android_apk.py --apk "$apk" \
              --abis "${package_abis[@]}" \
              --version-code "$((base_version_code * 1000 + abi_codes[$name]))" \
              --aapt2 "$android_sdk/build-tools/36.0.0/aapt2" \
              --zipalign "$android_sdk/build-tools/36.0.0/zipalign"
            entries="$RUNNER_TEMP/$name.entries"
            unzip -Z1 "$apk" > "$entries"
            actual_abis="$(
              sed -nE 's#^lib/([^/]+)/.*#\1#p' "$entries" |
                sort -u |
                paste -sd ' ' -
            )"
            test "$actual_abis" = "${expected_abis[$name]}" || {
              echo "Unexpected ABI set in $name: $actual_abis" >&2
              exit 1
            }
            for abi in ${expected_abis[$name]}; do
              grep -q "^lib/$abi/libusque_android\.so$" "$entries"
            done
            if grep -Eq 'kernel_blob\.bin|libVkLayer_khronos_validation\.so' "$entries"; then
              echo "$name contains a forbidden debug artifact." >&2
              exit 1
            fi
            while IFS= read -r library; do
              extracted="$RUNNER_TEMP/$(tr '/.' '__' <<<"$library")"
              unzip -p "$apk" "$library" > "$extracted"
              sections="$extracted.sections"
              readelf --sections "$extracted" > "$sections"
              if grep -q '\.debug_info' "$sections"; then
                echo "$library in $name contains debug information." >&2
                exit 1
              fi
            done < <(grep '/libusque_android\.so$' "$entries")
            "$apksigner" verify --verbose --print-certs "$apk"
            count=$((count + 1))
          done
          test "$count" -eq 4
          echo "ANDROID_BUILD_OK=$source_dir"

      - name: Archive matching Android Flutter symbols separately
        working-directory: apps/usque_gui
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: //p' pubspec.yaml | tr -d '\r')"
          commit="$(git rev-parse HEAD)"
          for abi in armeabi-v7a arm64-v8a x86_64; do
            python ../../tool/archive_flutter_symbols.py archive \
              --artifact "build/app/outputs/flutter-apk/app-$abi-release.apk" \
              --symbols "$RUNNER_TEMP/flutter-symbols-android/split" \
              --output "$RUNNER_TEMP/flutter-symbol-archives" \
              --version "$version" --source-commit "$commit" \
              --platform android --kind split --architecture "$abi"
          done
          python ../../tool/archive_flutter_symbols.py archive \
            --artifact build/app/outputs/flutter-apk/app-release.apk \
            --symbols "$RUNNER_TEMP/flutter-symbols-android/universal" \
            --output "$RUNNER_TEMP/flutter-symbol-archives" \
            --version "$version" --source-commit "$commit" \
            --platform android --kind universal \
            --architecture armeabi-v7a,arm64-v8a,x86_64

      - name: Preserve matching Android Flutter symbols separately
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: usque-flutter-symbols-android
          path: ${{ runner.temp }}/flutter-symbol-archives
          if-no-files-found: error
          retention-days: 90

      - name: Remove ephemeral identity and compile output
        if: ${{ always() }}
        run: |
          rm -f "$RUNNER_TEMP/usque-build-only.jks"
          rm -rf apps/usque_gui/build apps/usque_gui/android/app/src/main/jniLibs

  gate:
    name: Build / gate
    if: ${{ always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    needs: [windows, android, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every platform build
        env:
          WINDOWS_RESULT: ${{ needs.windows.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
          LINUX_RESULT: ${{ needs.linux.result }}
        run: |
          set -euo pipefail
          test "$WINDOWS_RESULT" = "success"
          test "$ANDROID_RESULT" = "success"
          test "$LINUX_RESULT" = "success"
