name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CMAKE_GENERATOR: Ninja
  FLUTTER_COMMIT: 84fc5cbb223bc12f83d65b647ff8a56caf779ffd
  FLUTTER_VERSION: 3.44.7

jobs:
  workflow-lint:
    name: GitHub Actions syntax and security lint
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.4
          check-latest: false
          cache: false

      - name: Install pinned actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

      - name: Lint workflows
        run: actionlint -no-color

      - name: Validate repository policy
        run: python tool/check_repository_policy.py

  rust:
    name: Rust format, lint, and tests
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          rustup default 1.97.1

      - name: Verify formatting
        run: |
          cargo fmt --all --check
          rustfmt \
            --edition 2021 \
            --check third_party/boring-sys-4.22.0/build/main.rs

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets --locked

  tooling-quality:
    name: Multi-language tooling quality
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install and verify Ruff 0.16.0
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ruff==0.16.0"
          test "$(ruff --version)" = "ruff 0.16.0"

      - name: Ruff lint and format check
        run: |
          ruff check tool
          ruff format --check tool

      - name: Install PowerShell
        shell: bash
        run: |
          set -euo pipefail
          # Microsoft package repository for PowerShell on Ubuntu 24.04
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc |
            sudo gpg --dearmor -o /usr/share/keyrings/microsoft.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft.gpg] https://packages.microsoft.com/ubuntu/24.04/prod noble main" |
            sudo tee /etc/apt/sources.list.d/microsoft-prod.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y powershell

      - name: Install and verify PSScriptAnalyzer 1.25.0
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser -AllowClobber
          $mod = Get-Module -ListAvailable PSScriptAnalyzer |
            Where-Object { $_.Version.ToString() -eq "1.25.0" } |
            Select-Object -First 1
          if (-not $mod) {
            throw "PSScriptAnalyzer 1.25.0 was not installed."
          }
          Write-Output "PSScriptAnalyzer $($mod.Version)"

      - name: PSScriptAnalyzer (warnings, errors, and casing block)
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          Import-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force
          $settings = "tool/PSScriptAnalyzerSettings.psd1"
          $findings = @(Get-ChildItem tool -Filter *.ps1 | ForEach-Object {
            Invoke-ScriptAnalyzer -Path $_.FullName -Settings $settings
            # PSUseCorrectCasing is Information, so run it outside the settings severity filter.
            Invoke-ScriptAnalyzer -Path $_.FullName -IncludeRule PSUseCorrectCasing
          })
          if ($findings.Count -gt 0) {
            $findings | Format-Table -AutoSize Severity, RuleName, ScriptName, Line, Message
            throw "PSScriptAnalyzer reported $($findings.Count) blocking finding(s)."
          }
          Write-Output "PSScriptAnalyzer: clean"

      - name: Install and verify Buf 1.72.0
        run: |
          set -euo pipefail
          BUF_VERSION=1.72.0
          # sha256 from https://github.com/bufbuild/buf/releases/download/v1.72.0/sha256.txt
          BUF_SHA256=8720830e26a733da55bb89bcd3cb44849c0965fc0c44fb5d691cccdc64dca5af
          curl -fsSL \
            "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64" \
            -o /tmp/buf
          echo "${BUF_SHA256}  /tmp/buf" | sha256sum -c -
          sudo install -m 0755 /tmp/buf /usr/local/bin/buf
          test "$(buf --version)" = "${BUF_VERSION}"

      - name: Buf lint and format check
        run: |
          set -euo pipefail
          buf lint
          buf format --exit-code --diff

      - name: Proto breaking check against PR target
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          [[ "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "${PR_BASE_SHA}^{commit}"
          # --against-config applies the current module path policy (proto/) even when
          # the PR base lacks buf.yaml, avoiding false FILE-path breaking failures.
          buf breaking \
            --against ".git#ref=${PR_BASE_SHA}" \
            --against-config buf.yaml

  android-host:
    name: Android host unit tests and lint
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter from pinned commit
        run: |
          mkdir -p "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" init
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin \
            "refs/tags/$FLUTTER_VERSION:refs/tags/$FLUTTER_VERSION"
          git -C "$RUNNER_TEMP/flutter" checkout --detach "refs/tags/$FLUTTER_VERSION"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_COMMIT"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Install pinned Rust and Android toolchains
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy
          rustup default 1.97.1
          rustup target add aarch64-linux-android
          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$android_sdk"
          sdkmanager="$android_sdk/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          "$sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1"

      - name: Clippy Android Rust (arm64-v8a lib)
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          & ./tool/build_android_rust.ps1 -CargoAction clippy

      - name: Resolve locked Flutter packages
        working-directory: apps/usque_gui
        run: flutter --suppress-analytics pub get --enforce-lockfile

      - name: Generate Android local build configuration
        working-directory: apps/usque_gui
        run: flutter --suppress-analytics build apk --debug --config-only --no-pub

      - name: Run Android application unit tests, ktlint, and lint
        working-directory: apps/usque_gui/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:ktlintCheck :app:testDebugUnitTest :app:lintDebug

  flutter:
    name: Flutter analysis and widget tests
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Flutter from pinned commit
        run: |
          mkdir -p "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" init
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin \
            "refs/tags/$FLUTTER_VERSION:refs/tags/$FLUTTER_VERSION"
          git -C "$RUNNER_TEMP/flutter" checkout --detach "refs/tags/$FLUTTER_VERSION"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Verify Flutter revision
        run: |
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_COMMIT"
          flutter --suppress-analytics --version

      - name: Resolve locked packages
        working-directory: apps/usque_gui
        run: flutter --suppress-analytics pub get --enforce-lockfile

      - name: Format
        working-directory: apps/usque_gui
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        working-directory: apps/usque_gui
        run: flutter --suppress-analytics analyze --no-pub

      - name: Test
        working-directory: apps/usque_gui
        run: flutter --suppress-analytics test --no-pub

  go-oracle:
    name: Archived Go oracle
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: oracle/go/go.mod
          cache-dependency-path: oracle/go/go.sum
          check-latest: false

      - name: Verify modules
        working-directory: oracle/go
        run: go mod verify

      - name: Verify archived source against fork point
        run: python tool/verify_oracle_archive.py

      - name: Test oracle
        working-directory: oracle/go
        run: go test ./...

  security-audit:
    name: Locked dependency vulnerability audit
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install and verify OSV-Scanner 2.3.8
        env:
          OSV_SHA256: bc98e15319ed0d515e3f9235287ba53cdc5535d576d24fd573978ecfe9ab92dc
        run: |
          set -euo pipefail
          curl -fsSL \
            https://github.com/google/osv-scanner/releases/download/v2.3.8/osv-scanner_linux_amd64 \
            -o "$RUNNER_TEMP/osv-scanner"
          echo "$OSV_SHA256  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/osv-scanner"
          "$RUNNER_TEMP/osv-scanner" --version

      - name: Scan shipping lockfiles
        run: |
          set -euo pipefail
          python tool/export_gradle_runtime_sbom.py \
            apps/usque_gui/android/app/gradle.lockfile \
            "$RUNNER_TEMP/android-release-runtime.cdx.json"
          set +e
          "$RUNNER_TEMP/osv-scanner" scan \
            --format json \
            --output-file "$RUNNER_TEMP/osv-shipping.json" \
            --config osv-scanner.toml \
            -L Cargo.lock \
            -L apps/usque_gui/pubspec.lock \
            -L "$RUNNER_TEMP/android-release-runtime.cdx.json"
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 1 ]; then
            echo "OSV-Scanner failed with exit code $status" >&2
            exit "$status"
          fi

      - name: Scan frozen Go oracle for information
        run: |
          set -euo pipefail
          set +e
          "$RUNNER_TEMP/osv-scanner" scan \
            --format json \
            --output-file "$RUNNER_TEMP/osv-oracle.json" \
            --config osv-scanner.toml \
            -L oracle/go/go.mod
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 1 ]; then
            echo "OSV-Scanner oracle scan failed with exit code $status" >&2
            exit "$status"
          fi

      - name: Enforce severity and exception policy
        run: |
          python tool/check_osv_results.py \
            --shipping "$RUNNER_TEMP/osv-shipping.json" \
            --oracle "$RUNNER_TEMP/osv-oracle.json" \
            --config osv-scanner.toml

  release-contract:
    name: Release artifact manifest contract
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test fail-closed artifact contract
        run: python -m unittest discover -s tool -p "test_*.py" -v

  windows-installer-authoring:
    name: MSI authoring (${{ matrix.arch }})
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: windows-2025
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            variant: x64-v2
            wintun_arch: amd64
          - arch: arm64
            variant: arm64
            wintun_arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.412

      - name: Restore pinned WiX tool
        run: |
          dotnet tool restore
          dotnet tool run wix -- extension add WixToolset.UI.wixext/5.0.2

      - name: Verify MSI version mapping
        shell: pwsh
        run: |
          $stable = & ./tool/convert_to_msi_version.ps1 -SemVer "v0.1.2"
          if ($stable -ne "0.1.299") {
            throw "Stable MSI version mapping is invalid: $stable"
          }

          $beta = & ./tool/convert_to_msi_version.ps1 -SemVer "0.1.2-beta.3"
          if ($beta -ne "0.1.203") {
            throw "Beta MSI version mapping is invalid: $beta"
          }

          $rejected = $false
          try {
            & ./tool/convert_to_msi_version.ps1 -SemVer "0.1.2-beta.0"
          } catch {
            $rejected = $_.Exception.Message -like "Beta ordinal must be*"
          }
          if (-not $rejected) {
            throw "Invalid beta ordinal was not rejected."
          }

      - name: Create inert authoring fixture
        shell: pwsh
        run: |
          $payload = Join-Path $env:RUNNER_TEMP "msi-payload"
          New-Item -ItemType Directory -Path (Join-Path $payload "data") -Force | Out-Null
          $fixture = "third_party/wintun-0.14.1/wintun/bin/${{ matrix.wintun_arch }}/wintun.dll"
          Copy-Item $fixture (Join-Path $payload "usque.exe")
          Copy-Item $fixture (Join-Path $payload "usque-engine.exe")
          Copy-Item $fixture (Join-Path $payload "usque-agent.exe")
          Copy-Item $fixture (Join-Path $payload "usque-uninstall.exe")
          Copy-Item $fixture (Join-Path $payload "wintun.dll")
          Copy-Item LICENSE.md (Join-Path $payload "data/LICENSE.md")

      - name: Compile MSI authoring
        shell: pwsh
        run: |
          $payload = Join-Path $env:RUNNER_TEMP "msi-payload"
          $output = Join-Path $env:RUNNER_TEMP "usque-authoring-${{ matrix.arch }}.msi"
          dotnet tool run wix -- build `
            -arch "${{ matrix.arch }}" `
            -ext "WixToolset.UI.wixext/5.0.2" `
            -bindpath "app=$payload" `
            -define "DisplayVersion=0.1.2" `
            -define "MsiVersion=0.1.299" `
            -define "Variant=${{ matrix.variant }}" `
            -define "SignerSha256=$("0" * 64)" `
            -define "IconPath=$((Resolve-Path "assets/branding/usque-app-icon.ico").Path)" `
            -define "LicensePath=$((Resolve-Path "packaging/windows/LICENSE.rtf").Path)" `
            -defaultcompressionlevel high `
            -intermediateFolder (Join-Path $env:RUNNER_TEMP "wix-${{ matrix.arch }}") `
            -pdbtype none `
            -out $output `
            packaging/windows/Usque.wxs `
            packaging/windows/UsqueUI.wxs
          if ($LASTEXITCODE -ne 0) { throw "WiX build failed." }

          & ./tool/verify_windows_msi.ps1 `
            -MsiPath $output `
            -Variant "${{ matrix.variant }}" `
            -ExpectedMsiVersion "0.1.299" `
            -ExpectedDisplayVersion "0.1.2" `
            -SignerSha256 ("0" * 64)

          # Equal-version validation packages intentionally replace the same
          # product; only the corresponding ICE61 warning is suppressed.
          dotnet tool run wix -- msi validate -sice ICE61 $output
          if ($LASTEXITCODE -ne 0) { throw "MSI ICE validation failed." }

  gate:
    name: CI / gate
    if: ${{ always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    needs:
      - workflow-lint
      - rust
      - tooling-quality
      - android-host
      - flutter
      - go-oracle
      - security-audit
      - release-contract
      - windows-installer-authoring
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every CI job
        env:
          WORKFLOW_LINT: ${{ needs.workflow-lint.result }}
          RUST: ${{ needs.rust.result }}
          TOOLING: ${{ needs.tooling-quality.result }}
          ANDROID_HOST: ${{ needs.android-host.result }}
          FLUTTER: ${{ needs.flutter.result }}
          GO_ORACLE: ${{ needs.go-oracle.result }}
          SECURITY_AUDIT: ${{ needs.security-audit.result }}
          RELEASE_CONTRACT: ${{ needs.release-contract.result }}
          WINDOWS_AUTHORING: ${{ needs.windows-installer-authoring.result }}
        run: |
          set -euo pipefail
          for result in \
            "$WORKFLOW_LINT" \
            "$RUST" \
            "$TOOLING" \
            "$ANDROID_HOST" \
            "$FLUTTER" \
            "$GO_ORACLE" \
            "$SECURITY_AUDIT" \
            "$RELEASE_CONTRACT" \
            "$WINDOWS_AUTHORING"; do
            test "$result" = "success"
          done
