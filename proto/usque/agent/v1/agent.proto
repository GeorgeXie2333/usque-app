syntax = "proto3";

package usque.agent.v1;

// The privileged Agent contract is deliberately narrower than the public
// Engine control contract. It contains no registration, identity, Secret,
// endpoint-pin material, bearer credentials, diagnostic-upload, or arbitrary
// command execution fields. Numeric control-plane destinations carry no
// identity data.

enum AgentPhase {
  AGENT_PHASE_UNSPECIFIED = 0;
  AGENT_PHASE_CLEAN = 1;
  AGENT_PHASE_PREPARING = 2;
  AGENT_PHASE_PREPARED = 3;
  AGENT_PHASE_ACTIVE = 4;
  // 5 was AGENT_PHASE_PAUSED (removed with captive-portal pause).
  reserved 5;
  AGENT_PHASE_RECOVERING = 6;
  AGENT_PHASE_RECOVERY_REQUIRED = 7;
}

enum AutomaticRecoveryPhase {
  AUTOMATIC_RECOVERY_PHASE_UNSPECIFIED = 0;
  AUTOMATIC_RECOVERY_PHASE_INACTIVE = 1;
  AUTOMATIC_RECOVERY_PHASE_WAITING = 2;
  AUTOMATIC_RECOVERY_PHASE_RUNNING = 3;
  AUTOMATIC_RECOVERY_PHASE_EXHAUSTED = 4;
  AUTOMATIC_RECOVERY_PHASE_BLOCKED = 5;
}

message AgentError {
  string code = 1;
  string message = 2;
  bool retryable = 3;
}

message AgentCapabilities {
  bool wintun = 1;
  bool wfp_kill_switch = 2;
  bool interface_addresses = 3;
  bool interface_dns = 4;
  bool system_proxy = 5;
  bool shared_packet_ring = 6;
  string operating_system = 7;
  string architecture = 8;
  uint32 protocol_version = 9;
  // The Agent can grant short-lived, exact physical-egress permits whose
  // lifetime is tied to the authenticated Engine pipe.
  bool dynamic_direct_egress = 10;
  // The Agent can snapshot numeric DNS servers from the selected physical
  // interface without exposing DNS payloads or host names.
  bool physical_dns_snapshot = 11;
  // Exact generation checks and generation-scoped liveness lease keys.
  bool exact_generation_egress = 12;
  // Compare-and-recover for an orphaned failed transaction. Never substitute
  // the unguarded maintenance Recover request when this capability is absent.
  bool guarded_recovery = 13;
  // The Agent can run bounded, exact-operation recovery retries without an
  // Engine connection and expose their sanitized in-memory status.
  bool automatic_recovery = 14;
  // Supports a protected bootstrap followed by final VPN address assignment.
  bool deferred_network_configuration = 15;
  // A process-scoped device lease outlives individual packet sessions.
  bool reusable_tun_device = 16;
}

message TunnelPlan {
  string profile_id = 1;
  string endpoint = 2;
  uint32 mtu = 3;
  repeated string dns_servers = 4;
  repeated string split_exclusions = 5;
  bool allow_lan = 6;
  bool kill_switch = 7;
  string assigned_ipv4 = 8;
  string assigned_ipv6 = 9;
  // Both numeric candidates used by Happy Eyeballs. `endpoint` is the
  // currently preferred/selected value and must be present in this list.
  repeated string endpoint_candidates = 10;
  // Pre-resolved Cloudflare registration API addresses. The Agent permits
  // only the authenticated Engine binary to reach TCP/443 on these hosts so
  // an endpoint-pin mismatch can refresh once without opening general egress.
  repeated string control_api_candidates = 11;
  // The Wintun interface publishes Engine-owned Split DNS addresses and must
  // receive exact host routes for them even when LAN exclusions overlap.
  bool split_dns = 12;
  // The final exit is carried by WARP and may expose only one payload family.
  bool vpn_chain = 13;
  // Prepare only bootstrap protection. Commit requires FinalizeTunnel first.
  bool defer_network_configuration = 14;
}

message FinalizeTunnelRequest {
  string operation_id = 1;
  TunnelPlan plan = 2;
}

// Retains this operation's adapter and bootstrap permits, and installs chain
// protection before the Engine replaces any final packet session.
message BeginChainTransitionRequest {
  string operation_id = 1;
  bool retain_startup_lease = 2;
}

message GetCapabilitiesRequest {}
message GetStateRequest {}
message RecoverRequest {}

message RecoverOrphanedRequest {
  string operation_id = 1;
  uint64 expected_journal_generation = 2;
}

message RestartAutomaticRecoveryRequest {
  string operation_id = 1;
  uint64 expected_journal_generation = 2;
}

message PrepareTunnelRequest {
  string operation_id = 1;
  TunnelPlan plan = 2;
  string device_lease_id = 3;
  uint64 device_lease_generation = 4;
  uint64 expected_journal_generation = 5;
}

message AcquireDeviceLeaseRequest {}

message ReleaseDeviceLeaseRequest {
  string lease_id = 1;
  uint64 lease_generation = 2;
}

message DeviceLease {
  string lease_id = 1;
  uint64 lease_generation = 2;
  uint64 journal_generation = 3;
}

enum ManagedDevicePhase {
  MANAGED_DEVICE_PHASE_UNSPECIFIED = 0;
  MANAGED_DEVICE_PHASE_ABSENT = 1;
  MANAGED_DEVICE_PHASE_CREATING = 2;
  MANAGED_DEVICE_PHASE_IDLE = 3;
  MANAGED_DEVICE_PHASE_IN_USE = 4;
  MANAGED_DEVICE_PHASE_RETIRING = 5;
  MANAGED_DEVICE_PHASE_RECOVERY_REQUIRED = 6;
}

message ManagedDeviceStatus {
  ManagedDevicePhase phase = 1;
  bool lease_attached = 2;
  uint64 device_generation = 3;
}

message CommitTunnelRequest {
  string operation_id = 1;
}

message RollbackTunnelRequest {
  string operation_id = 1;
  string reason_code = 2;
}

message ApplySystemProxyRequest {
  string operation_id = 1;
  string proxy_uri = 2;
  repeated string bypass_hosts = 3;
}

message RestoreSystemProxyRequest {
  string operation_id = 1;
}

message OpenPacketSessionRequest {
  string operation_id = 1;
  uint32 ring_capacity = 2;
}

message ClosePacketSessionRequest {
  string operation_id = 1;
}

// Recreates only the volatile Wintun session and shared packet ring for an
// already-active, journaled tunnel. Persistent routes, DNS, and WFP policy are
// intentionally left untouched while the authenticated Engine reattaches.
message ResumeTunnelRequest {
  string operation_id = 1;
  string profile_id = 2;
}

// The response is written before the connection becomes a liveness lease.
// Closing the owning Engine process/pipe detaches only the volatile packet
// session; it never rolls back persistent WFP, routes, or DNS.
message AcquireTunnelLeaseRequest {
  string operation_id = 1;
}

message GetPhysicalNetworkInfoRequest {
  string operation_id = 1;
}

// Read-only, allowlisted platform inspection. Counts and state enums are
// returned instead of adapter names, addresses, DNS servers, paths, SIDs, or
// other stable machine identifiers.
message InspectPlatformStateRequest {}

message PlatformState {
  string service_state = 1;
  AgentPhase agent_phase = 2;
  bool active_tunnel_lease = 3;
  bool packet_session_active = 4;
  string wintun_adapter_state = 5;
  uint32 expected_route_count = 6;
  bool actual_route_count_known = 7;
  uint32 actual_route_count = 8;
  string expected_dns_state = 9;
  string actual_dns_state = 10;
  string expected_wfp_state = 11;
  string actual_wfp_state = 12;
  bool system_proxy_lease = 13;
  string recovery_journal_state = 14;
  bool pending_cleanup = 15;
  uint64 journal_generation = 16;
  AutomaticRecoveryStatus automatic_recovery = 17;
  // Optional, read-only evidence. Absence means an older Agent, never Clean.
  RecoveryDiagnostics recovery_diagnostics = 18;
  ManagedDeviceStatus device = 19;
}

enum RecoverySampleStatus {
  RECOVERY_SAMPLE_STATUS_UNSPECIFIED = 0;
  RECOVERY_SAMPLE_STATUS_COMPLETE = 1;
  RECOVERY_SAMPLE_STATUS_TIMEOUT = 2;
  RECOVERY_SAMPLE_STATUS_BUSY = 3;
  RECOVERY_SAMPLE_STATUS_UNAVAILABLE = 4;
  RECOVERY_SAMPLE_STATUS_GENERATION_CHANGED = 5;
  RECOVERY_SAMPLE_STATUS_NO_RECEIPT = 6;
}

enum RecoveryPresence {
  RECOVERY_PRESENCE_UNSPECIFIED = 0;
  RECOVERY_PRESENCE_PRESENT = 1;
  RECOVERY_PRESENCE_ABSENT = 2;
}

enum RecoveryIdentityCheck {
  RECOVERY_IDENTITY_CHECK_UNSPECIFIED = 0;
  RECOVERY_IDENTITY_CHECK_VERIFIED = 1;
  RECOVERY_IDENTITY_CHECK_CONFLICT = 2;
  RECOVERY_IDENTITY_CHECK_INVALID_RECEIPT = 3;
}

enum RecoveryDiagnosticApi {
  RECOVERY_DIAGNOSTIC_API_UNSPECIFIED = 0;
  RECOVERY_DIAGNOSTIC_API_GET_IF_TABLE2 = 1;
  RECOVERY_DIAGNOSTIC_API_SETUP_DI_GET_CLASS_DEVS = 2;
  RECOVERY_DIAGNOSTIC_API_SETUP_DI_ENUM_DEVICE_INFO = 3;
  RECOVERY_DIAGNOSTIC_API_SETUP_DI_GET_DEVICE_INSTANCE_ID = 4;
  RECOVERY_DIAGNOSTIC_API_SETUP_DI_SET_CLASS_INSTALL_PARAMS = 5;
  RECOVERY_DIAGNOSTIC_API_SETUP_DI_CALL_CLASS_INSTALLER = 6;
  RECOVERY_DIAGNOSTIC_API_OTHER = 7;
  RECOVERY_DIAGNOSTIC_API_CM_GET_DEV_NODE_STATUS = 8;
}

message RecoveryResourceObservation {
  RecoveryPresence presence = 1;
  RecoveryIdentityCheck identity_check = 2;
  RecoveryDiagnosticApi api = 3;
  optional uint32 win32_code = 4;
  // IP Helper state enums, never interface identifiers.
  optional uint32 interface_oper_status = 5;
  optional uint32 interface_admin_status = 6;
  optional uint32 media_connect_state = 7;
  optional uint32 devnode_status = 8;
  optional uint32 problem_code = 9;
  // CONFIGRET is a different error namespace from GetLastError/Win32.
  optional uint32 configret_code = 10;
}

message RecoveryObservation {
  uint64 sampled_at_unix_ms = 1;
  uint64 journal_generation = 2;
  RecoverySampleStatus status = 3;
  RecoveryResourceObservation interface = 4;
  RecoveryResourceObservation pnp_device = 5;
}

enum RecoveryHistoryStatus {
  RECOVERY_HISTORY_STATUS_UNSPECIFIED = 0;
  RECOVERY_HISTORY_STATUS_COMPLETE = 1;
  RECOVERY_HISTORY_STATUS_MISSING = 2;
  RECOVERY_HISTORY_STATUS_PARTIAL = 3;
  RECOVERY_HISTORY_STATUS_TOO_LARGE = 4;
  RECOVERY_HISTORY_STATUS_UNAVAILABLE = 5;
}

enum RecoveryStep {
  RECOVERY_STEP_UNSPECIFIED = 0;
  RECOVERY_STEP_WINTUN_ADAPTER = 1;
  RECOVERY_STEP_ENDPOINT_BYPASS = 2;
  RECOVERY_STEP_KILL_SWITCH = 3;
  RECOVERY_STEP_INTERFACE_CONFIGURATION = 4;
  RECOVERY_STEP_DNS = 5;
  RECOVERY_STEP_PACKET_SESSION = 6;
  RECOVERY_STEP_DEFAULT_ROUTES = 7;
  RECOVERY_STEP_SYSTEM_PROXY = 8;
}

enum RecoveryRemovalStage {
  RECOVERY_REMOVAL_STAGE_UNSPECIFIED = 0;
  RECOVERY_REMOVAL_STAGE_OBSERVE = 1;
  RECOVERY_REMOVAL_STAGE_REQUEST = 2;
  RECOVERY_REMOVAL_STAGE_CONFIRM = 3;
}

enum RecoveryRemovalFailure {
  RECOVERY_REMOVAL_FAILURE_UNSPECIFIED = 0;
  RECOVERY_REMOVAL_FAILURE_PENDING = 1;
  RECOVERY_REMOVAL_FAILURE_IDENTITY = 2;
  RECOVERY_REMOVAL_FAILURE_NATIVE = 3;
}

message RecoveryRemovalResult {
  RecoveryRemovalStage stage = 1;
  RecoveryRemovalFailure failure = 2;
  RecoveryPresence interface = 3;
  RecoveryPresence pnp_device = 4;
  bool request_accepted = 5;
  uint64 elapsed_ms = 6;
  RecoveryDiagnosticApi api = 7;
  optional uint32 win32_code = 8;
}

message RecoveryHistoryEvent {
  uint64 occurred_at_unix_ms = 1;
  uint64 journal_generation = 2;
  RecoveryStep step = 3;
  bool restored = 4;
  uint64 elapsed_ms = 5;
  RecoveryDiagnosticApi api = 6;
  optional uint32 win32_code = 7;
  RecoveryRemovalResult adapter = 8;
}

message RecoveryDiagnostics {
  RecoveryObservation current = 1;
  RecoveryHistoryStatus history_status = 2;
  // Latest at most 32 valid events, in file order. Never current observations.
  repeated RecoveryHistoryEvent history = 3;
  // Separate process/resource lifecycle evidence; absence means an older Agent.
  RecoveryTrace trace = 4;
}

enum RecoveryTraceStage {
  RECOVERY_TRACE_STAGE_UNSPECIFIED = 0;
  RECOVERY_TRACE_STAGE_PUMP_STOP_REQUESTED = 1;
  RECOVERY_TRACE_STAGE_PUMP_JOIN_STARTED = 2;
  RECOVERY_TRACE_STAGE_PUMP_JOIN_RETURNED = 3;
  RECOVERY_TRACE_STAGE_END_SESSION_STARTED = 4;
  RECOVERY_TRACE_STAGE_END_SESSION_RETURNED = 5;
  RECOVERY_TRACE_STAGE_ADAPTER_RELEASE_REQUESTED = 6;
  RECOVERY_TRACE_STAGE_CLOSE_ADAPTER_STARTED = 7;
  RECOVERY_TRACE_STAGE_CLOSE_ADAPTER_RETURNED = 8;
  RECOVERY_TRACE_STAGE_NATIVE_REMOVE_FAILED = 9;
  RECOVERY_TRACE_STAGE_NATIVE_ORPHAN_REMOVE_FAILED = 10;
  RECOVERY_TRACE_STAGE_NATIVE_ORPHAN_REMOVED = 11;
  RECOVERY_TRACE_STAGE_NATIVE_OTHER = 12;
  RECOVERY_TRACE_STAGE_OBSERVATION_STARTED = 13;
  RECOVERY_TRACE_STAGE_OBSERVATION_CHANGED = 14;
  RECOVERY_TRACE_STAGE_OBSERVATION_ABSENT = 15;
  RECOVERY_TRACE_STAGE_OBSERVATION_DEADLINE = 16;
  RECOVERY_TRACE_STAGE_OBSERVATION_CANCELLED = 17;
  RECOVERY_TRACE_STAGE_REMOVAL_ATTEMPT_STARTED = 18;
  RECOVERY_TRACE_STAGE_REMOVAL_ATTEMPT_RETURNED = 19;
}

message RecoveryTraceEvent {
  uint32 schema_version = 1;
  // Random per-process nonce and per-process counter, never PID/GUID/LUID.
  uint64 agent_run_id = 2;
  uint64 event_sequence = 3;
  uint64 occurred_at_unix_ms = 4;
  uint64 monotonic_ms = 5;
  // Zero denotes an unassociated callback, not the latest transaction.
  uint64 journal_generation = 6;
  uint64 resource_id = 7;
  RecoveryTraceStage stage = 8;
  optional uint64 elapsed_ms = 9;
  optional uint32 reference_count = 10;
  // Packet-pump joins and removal attempts have results; Wintun VOID returns do not.
  optional bool succeeded = 11;
  RecoveryObservation observation = 12;
  // 1 info, 2 warning, 3 error. No native message text crosses the boundary.
  optional uint32 native_level = 13;
  uint64 dropped_events = 14;
  uint64 write_failures = 15;
}

message RecoveryTrace {
  RecoveryHistoryStatus status = 1;
  // Latest at most 128 valid records, with original event times.
  repeated RecoveryTraceEvent events = 2;
  uint64 dropped_events = 3;
  uint64 write_failures = 4;
}

message PhysicalInterface {
  uint64 interface_luid = 1;
  uint32 interface_index = 2;
  repeated string dns_servers = 3;
  // Bit 0 = IPv4 and bit 1 = IPv6, from current non-TUN route observation.
  uint32 address_family_mask = 4;
}

message PhysicalNetworkInfo {
  repeated PhysicalInterface interfaces = 1;
  // Monotonically increasing journal generation. A new generation invalidates
  // DNS queries, DNS-derived route hints, and direct-flow leases.
  uint64 generation = 2;
}

message AcquireDirectEgressRequest {
  string operation_id = 1;
  // Numeric IP address and non-zero destination port only.
  string remote_endpoint = 2;
  // IANA protocol number. Version 3 accepts TCP (6) and UDP (17).
  uint32 protocol = 3;
  // Zero preserves the legacy request shape; non-zero must match exactly.
  uint64 expected_generation = 4;
}

message DirectEgressLease {
  uint64 interface_luid = 1;
  uint32 interface_index = 2;
  string remote_endpoint = 3;
  uint32 protocol = 4;
  uint64 network_generation = 5;
}

message AgentState {
  AgentPhase phase = 1;
  string operation_id = 2;
  string profile_id = 3;
  bool kill_switch_active = 4;
  bool system_proxy_active = 5;
  bool packet_session_active = 6;
  uint64 journal_generation = 7;
  repeated string warnings = 8;
  AutomaticRecoveryStatus automatic_recovery = 9;
  // Authenticated callers can retain the original bootstrap policy when
  // applying a newly negotiated final network to this operation.
  TunnelPlan plan = 10;
  ManagedDeviceStatus device = 11;
}

message AutomaticRecoveryStatus {
  AutomaticRecoveryPhase phase = 1;
  uint32 attempts_completed = 2;
  uint32 attempt_limit = 3;
  // Present only for EXHAUSTED or BLOCKED. Intermediate errors remain local
  // to the Agent so user interfaces do not surface failures while healing.
  AgentError terminal_error = 4;
}

// HANDLE values are duplicated into the authenticated Engine process before
// being returned. They are opaque and valid only inside that exact process.
message PacketSessionHandles {
  uint64 mapping_handle = 1;
  uint64 engine_to_agent_event_handle = 2;
  uint64 agent_to_engine_event_handle = 3;
  uint64 shutdown_event_handle = 4;
  uint32 ring_capacity = 5;
  uint32 layout_version = 6;
}

message Empty {}

message AgentRequest {
  string request_id = 1;
  uint32 protocol_version = 2;
  // 15 was PauseKillSwitchRequest (removed with captive-portal pause).
  reserved 15;
  oneof payload {
    GetCapabilitiesRequest get_capabilities = 10;
    GetStateRequest get_state = 11;
    PrepareTunnelRequest prepare_tunnel = 12;
    CommitTunnelRequest commit_tunnel = 13;
    RollbackTunnelRequest rollback_tunnel = 14;
    ApplySystemProxyRequest apply_system_proxy = 16;
    RestoreSystemProxyRequest restore_system_proxy = 17;
    RecoverRequest recover = 18;
    OpenPacketSessionRequest open_packet_session = 19;
    ClosePacketSessionRequest close_packet_session = 20;
    ResumeTunnelRequest resume_tunnel = 21;
    AcquireTunnelLeaseRequest acquire_tunnel_lease = 22;
    GetPhysicalNetworkInfoRequest get_physical_network_info = 23;
    AcquireDirectEgressRequest acquire_direct_egress = 24;
    InspectPlatformStateRequest inspect_platform_state = 25;
    RecoverOrphanedRequest recover_orphaned = 26;
    RestartAutomaticRecoveryRequest restart_automatic_recovery = 27;
    FinalizeTunnelRequest finalize_tunnel = 28;
    BeginChainTransitionRequest begin_chain_transition = 29;
    AcquireDeviceLeaseRequest acquire_device_lease = 30;
    ReleaseDeviceLeaseRequest release_device_lease = 31;
  }
}

message AgentResponse {
  string request_id = 1;
  AgentError error = 2;
  oneof payload {
    Empty empty = 10;
    AgentCapabilities capabilities = 11;
    AgentState state = 12;
    PacketSessionHandles packet_session = 13;
    PhysicalNetworkInfo physical_network_info = 14;
    DirectEgressLease direct_egress_lease = 15;
    PlatformState platform_state = 16;
    DeviceLease device_lease = 17;
  }
}
